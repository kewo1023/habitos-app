<!DOCTYPE html>
<!--
  ============================================================
  MIS HÁBITOS — v0.1
  ============================================================
  Todo el proyecto vive en este único archivo. Tiene 3 partes:

    1. <style>  -> cómo se ve      (CSS)
    2. <body>   -> qué elementos hay (HTML)
    3. <script> -> qué hace         (JavaScript)

  Los datos se guardan en el propio teléfono/navegador con
  "localStorage". No hay servidor, no hay internet, no hay cuentas.
  ============================================================
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Esta línea hace que se vea bien en pantalla de teléfono -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mis Hábitos</title>

  <!-- Estas líneas son las que hacen que, al agregarla a la pantalla
       de inicio del iPhone, se abra sin barra de Safari y con ícono propio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hábitos">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1115">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="icon" href="icono-192.png">
  <link rel="manifest" href="manifest.json">

<script>
/* Este trocito va aquí arriba a propósito, ANTES de que se dibuje nada.
   Si el tema se aplicara al final (junto con el resto del JavaScript), la app
   abriría un instante en oscuro y saltaría a claro: ese parpadeo se ve feo y
   pasa en cada apertura.

   Es una copia reducida de aplicarTema(), que vive abajo con todo lo demás.
   Está duplicado a propósito: aquí solo puede correr lo mínimo, porque en
   este momento todavía no existe ni `datos` ni ninguna de nuestras funciones. */
(function () {
  try {
    const guardado = JSON.parse(localStorage.getItem('habitos-app-v1') || '{}');
    const elegido = (guardado.prefs && guardado.prefs.tema) || 'auto';
    const oscuro = elegido === 'oscuro' || (elegido === 'auto' &&
      window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
  } catch (e) {
    // Si los datos no se pueden leer, oscuro: es como nació la app.
    document.documentElement.dataset.tema = 'oscuro';
  }
})();
</script>

<style>
/* ---------- 1. VARIABLES: los colores en un solo sitio ----------
   Hasta la v14 aquí había UN solo juego de colores. Ahora hay dos, y el que
   manda lo decide el atributo `data-tema` de la etiqueta <html>, que pone la
   función aplicarTema().

   Fíjate en que "Automático" NO es un tercer juego de colores: se traduce a
   claro u oscuro preguntándole al teléfono antes de dibujar. Así el CSS solo
   tiene que conocer dos temas, que es la mitad de colores que mantener.

   Regla para el futuro: si necesitas un color nuevo, ponlo aquí en los dos
   bloques. Un color escrito suelto abajo funciona en un tema y se rompe en el
   otro, y no te enteras hasta que alguien cambia el modo del teléfono.       */
:root, :root[data-tema="oscuro"] {
  --fondo:        #0f1115;
  --tarjeta:      #191c23;
  --tarjeta-alta: #22262f;
  --tarjeta-hecha:#12141a;   /* más oscura que la normal: el hábito ya cumplido "se hunde" */
  --borde:        #2a2f3a;
  --texto:        #e8eaed;
  --texto-suave:  #8b919d;
  --acento:       #5b8def;
  --exito:        #3ecf8e;

  /* Los que antes estaban escritos a mano abajo. Cada uno tenía un valor
     pensado para fondo oscuro, así que en claro había que darle la vuelta. */
  --texto-fuerte:  #ffffff;              /* la pestaña activa: blanco puro contra el gris */
  --sobre-acento:  #ffffff;              /* texto encima del azul */
  --sobre-exito:   #0f1115;              /* texto encima del verde */
  --peligro:       #ff8a80;
  --peligro-borde: rgba(255,138,128,.35);
  --exito-borde:   rgba(62,207,142,.30);
  --velo:          rgba(0,0,0,.65);      /* el fondo oscuro detrás de las ventanas */

  /* El tercer color del confeti. El verde y el azul ya los tiene la app; hacía
     falta uno cálido para que los papelitos no parezcan más de lo mismo. */
  --celebrar:      #f2c14e;
}

/* El tema claro. No es "el oscuro con los números al revés": el fondo no es
   blanco puro sino un gris muy claro, para que las tarjetas (esas sí blancas)
   se despeguen del fondo. Con fondo blanco y tarjeta blanca no se distingue
   nada sin meter sombras por todas partes.

   El azul y el verde también cambian: los del tema oscuro son claros a
   propósito para brillar sobre negro, y sobre blanco quedan lavados y sin
   contraste suficiente para leer. */
:root[data-tema="claro"] {
  --fondo:        #f4f5f7;
  --tarjeta:      #ffffff;
  --tarjeta-alta: #e8eaee;
  --tarjeta-hecha:#eef3ef;   /* en claro "hundirse" es tomar un tinte verdoso, no oscurecerse */
  --borde:        #dde0e6;
  --texto:        #14161a;
  --texto-suave:  #6a707c;
  --acento:       #2563eb;
  --exito:        #15803d;

  --texto-fuerte:  #000000;
  --sobre-acento:  #ffffff;
  --sobre-exito:   #ffffff;
  --peligro:       #b42318;
  --peligro-borde: rgba(180,35,24,.30);
  --exito-borde:   rgba(21,128,61,.28);
  --velo:          rgba(15,17,21,.42);

  /* El mismo amarillo, un punto más oscuro: sobre fondo claro el de arriba
     casi desaparece. Es el mismo ajuste que hubo que hacerle al verde. */
  --celebrar:      #d99e10;
}

/* ---------- 2. RESET: quitar los estilos raros por defecto ---------- */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--fondo);
  color: var(--texto);
  /* padding extra arriba/abajo para el "notch" del iPhone */
  padding: max(20px, env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom));
  max-width: 620px;
  margin: 0 auto;
  min-height: 100vh;
  -webkit-user-select: none;
  user-select: none;
}

/* ---------- 3. CABECERA ---------- */
header { margin-bottom: 22px; }

.fecha {
  font-size: 13px;
  color: var(--texto-suave);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 600;
}

.titulo {
  font-size: 30px;
  font-weight: 700;
  margin-top: 4px;
  letter-spacing: -0.5px;
}

/* Barra de progreso del día */
.progreso-caja { margin-top: 18px; }

.progreso-texto {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--texto-suave);
  margin-bottom: 8px;
}

.progreso-fondo {
  height: 8px;
  background: var(--tarjeta-alta);
  border-radius: 99px;
  overflow: hidden;
}

.progreso-barra {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--acento), var(--exito));
  border-radius: 99px;
  transition: width .45s cubic-bezier(.2,.8,.2,1);
}

/* ---------- 4. TARJETA DE HÁBITO ---------- */
.habito {
  background: var(--tarjeta);
  border: 1px solid var(--borde);
  border-radius: 18px;
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform .12s ease, background .2s ease;
}

.habito:active { transform: scale(0.98); }

/* Cuando el hábito ya está hecho hoy.
   Cuatro señales a la vez, para que se note de un vistazo sin leer:
     1. fondo más oscuro -> la tarjeta se hunde en vez de resaltar
     2. barra verde a la izquierda (box-shadow "inset" = sombra por dentro;
        la usamos en vez de un border para que no mueva el contenido)
     3. borde verdoso tenue
     4. toda la tarjeta un poco desvanecida */
.habito.hecho {
  background: var(--tarjeta-hecha);
  border-color: var(--exito-borde);
  box-shadow: inset 3px 0 0 var(--exito);
  opacity: .72;
}

.habito.hecho .habito-nombre { color: var(--texto-suave); text-decoration: line-through; }

.habito-emoji {
  font-size: 26px;
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: 14px;
  background: var(--tarjeta-alta);
  flex-shrink: 0;
}

.habito-info { flex: 1; min-width: 0; }

.habito-nombre {
  font-size: 16px;
  font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Los 7 puntitos de la última semana */
.semana { display: flex; gap: 4px; margin-top: 7px; align-items: center; }

/* Los 11px son tu ajuste y se respetan como medida ideal, pero ahora los
   puntos pueden encoger si hace falta. Eso es lo que dice "flex: 0 1 11px":
     0  -> nunca crezcas más de 11px
     1  -> sí puedes encoger si no cabes
     11px -> tu tamaño preferido
   Antes eran 11px rígidos: 14 puntos ocupaban todo el ancho y la racha se
   caía a la línea de abajo. aspect-ratio: 1 los mantiene redondos al encoger. */
.dia {
  flex: 0 1 11px;
  min-width: 6px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--borde);
}

.dia.lleno { background: var(--exito); }

.racha {
  font-size: 12px;
  color: var(--texto-suave);
  margin-left: 8px;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;       /* los puntos ceden espacio, la racha no */
  white-space: nowrap;  /* el 🔥 y el número nunca se separan en dos líneas */
}

/* El círculo que se marca al tocar */
.check {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 2px solid var(--borde);
  display: grid; place-items: center;
  flex-shrink: 0;
  cursor: pointer;
  transition: all .2s ease;
  font-size: 16px;
  color: transparent;
}

.habito.hecho .check {
  background: var(--exito);
  border-color: var(--exito);
  color: var(--sobre-exito);
}

/* --- La celebración al marcar un hábito ---
   Dos momentos, dos animaciones de tamaño muy distinto a propósito:
   marcar pasa cinco o seis veces al día, así que su señal es pequeña;
   completar el día pasa una vez, y esa sí lleva confeti. Si la grande
   saliera en cada toque, dejaría de significar algo en una semana. */

@keyframes pop-check {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* La onda es un pseudo-elemento ENCIMA del círculo, no el círculo mismo.
   Si le hiciéramos un scale grande al propio .check, empujaría el texto de
   la tarjeta hacia los lados mientras dura la animación. */
@keyframes onda {
  from { transform: scale(1);   opacity: .5; }
  to   { transform: scale(2.3); opacity: 0; }
}

.check { position: relative; }

.check.celebrar { animation: pop-check .34s cubic-bezier(.2,.9,.3,1.4); }

.check.celebrar::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  border: 2px solid var(--exito);
  animation: onda .5s ease-out forwards;
  /* La onda queda encima del círculo. Sin esto se comería el siguiente toque
     durante medio segundo, justo cuando quieres desmarcar por error. */
  pointer-events: none;
}

/* --- El confeti del día completo ---
   Vive en una capa fija encima de todo. pointer-events: none la vuelve
   invisible al dedo: es decoración, los toques la atraviesan y llegan a la
   app que hay debajo. */
.confeti {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 100;
}

/* Cada papelito recibe sus propias variables (--dx, --giro, --dur) desde
   JavaScript. Así la animación es una sola y el CSS no sabe nada de azar. */
.papelito {
  position: absolute;
  width: 8px;
  height: 13px;
  opacity: 0;
  /* Le avisa al navegador qué va a cambiar, para que lo prepare en la tarjeta
     gráfica en vez de recalcularlo cuadro a cuadro. En un iPhone se nota. */
  will-change: transform, opacity;
  animation: caer var(--dur) cubic-bezier(.15,.6,.5,1) forwards;
}

@keyframes caer {
  0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }
  85%  { opacity: 1; }
  100% { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--giro)); opacity: 0; }
}

/* Hay gente a la que el movimiento en pantalla le produce mareo, y iOS tiene
   un ajuste para pedir que se reduzca (Accesibilidad > Movimiento). Respetarlo
   es parte de hacer las cosas bien, no un extra. El confeti además se apaga
   desde JavaScript, que es más barato que dibujarlo y esconderlo. */
@media (prefers-reduced-motion: reduce) {
  .check.celebrar,
  .check.celebrar::after,
  .papelito,
  .tarea.recien-movida { animation: none; }
}

/* Botones de mover y borrar. Solo aparecen en modo edición, donde
   reemplazan al círculo de marcar. */
.acciones { display: none; gap: 2px; align-items: center; flex-shrink: 0; }

body.editando .acciones { display: flex; }
body.editando .check    { display: none; }

.acciones button {
  background: none; border: none;
  color: var(--texto-suave);
  font-size: 18px; cursor: pointer;
  padding: 6px 7px;
  font-family: inherit;
  line-height: 1;
}

/* Un hábito que ya está arriba del todo no puede subir más:
   en vez de esconder el botón, lo apagamos. Si desapareciera,
   los botones se moverían de sitio y terminarías tocando el que no era. */
.acciones button:disabled { opacity: .2; cursor: default; }

.borrar { font-size: 20px; }

/* En modo edición el nombre y el emoji se pueden tocar para cambiarlos.
   El punteado es la pista de que ahí se puede tocar. */
body.editando .habito-nombre {
  border-bottom: 1px dashed var(--borde);
  display: inline-block;
  max-width: 100%;
}

body.editando .habito-emoji { border-style: dashed; border-color: var(--acento); }

/* ---------- 4b. PANEL DE COPIA DE SEGURIDAD ----------
   Solo aparece en modo edición, para no estorbar en el uso diario */
.panel-datos {
  display: none;
  margin-top: 26px;
  padding: 16px;
  background: var(--tarjeta);
  border: 1px solid var(--borde);
  border-radius: 18px;
}

body.editando .panel-datos { display: block; }

.panel-botones { display: flex; gap: 8px; margin-top: 10px; }

.btn-mini {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--borde);
  background: var(--fondo);
  color: var(--texto);
  font-family: inherit;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
}

.btn-mini:active { background: var(--tarjeta-alta); }

.nota {
  font-size: 12px;
  color: var(--texto-suave);
  margin-top: 12px;
  line-height: 1.5;
}

/* --- El control segmentado de Ajustes (idioma y tema) ---
   Son opciones que se excluyen entre sí: solo una puede estar activa. Por eso
   van como una fila de botones pegados y no como una lista con palomitas.
   `grid` con `1fr` reparte el ancho por igual: si mañana agregas un idioma,
   los tres siguen midiendo lo mismo sin tocar nada aquí.

   `minmax(0, 1fr)` en vez de `1fr` a secas: sin el 0, una palabra larga
   ("Automático") obliga a su columna a crecer y desequilibra la fila.        */
.segmentado {
  display: grid;
  gap: 6px;
  margin-top: 10px;
}

.segmentado.dos  { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.segmentado.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.segmentado button {
  padding: 11px 6px;
  border: 1px solid var(--borde);
  border-radius: 11px;
  background: var(--fondo);
  color: var(--texto-suave);
  font-family: inherit;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
}

/* La opción elegida no se rellena de azul: solo se le pinta el borde y la
   letra. Un bloque azul sólido aquí competiría con el botón grande de abajo,
   que ya usa ese mismo azul y es la acción principal de la pantalla. */
.segmentado button.activo {
  border-color: var(--acento);
  color: var(--acento);
  font-weight: 700;
}

/* La etiqueta de cada grupo dentro del panel de Ajustes. Va más pequeña que
   el título del panel: son subtítulos, no secciones nuevas. */
.sub-etiqueta {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--texto-suave);
  margin-top: 18px;
}

/* El primero no lleva el margen de arriba: ya lo pone el propio panel. */
.panel-datos .sub-etiqueta:first-of-type { margin-top: 12px; }

/* ---------- 4c. LA SECCIÓN DE PENDIENTES ----------
   La app ahora tiene dos secciones. Piénsalo como dos hojas del mismo
   libro de Excel: los datos viven en el mismo archivo, pero miras una
   a la vez. Aquí abajo está todo lo visual de la segunda hoja.        */

/* Las dos pestañas de arriba */
.pestanas {
  display: flex;
  gap: 6px;
  background: var(--tarjeta);
  border: 1px solid var(--borde);
  border-radius: 14px;
  padding: 4px;
  margin-top: 16px;
}

.pestana {
  position: relative;        /* para poder colgarle la línea de abajo */
  flex: 1;
  min-width: 0;              /* deja que encojan si el texto es largo */
  padding: 10px 6px 13px;
  border: none;
  border-radius: 10px;
  background: none;
  color: var(--texto-suave);
  font-family: inherit;
  font-size: 14px; font-weight: 600;
  white-space: nowrap;       /* "Pendientes 4" nunca se parte en dos líneas */
  cursor: pointer;
  transition: background .18s ease, color .18s ease;
}

/* La pestaña en la que estás parado. Es la única pista de "dónde estoy", así
   que lleva CUATRO señales pequeñas a la vez en vez de una grande: fondo más
   claro, blanco puro (las otras son grises), negrilla y una línea de acento
   debajo. El mismo criterio que usamos con los hábitos ya cumplidos: varias
   señales suaves se leen mejor y más rápido que una sola señal fuerte. */
.pestana.activa {
  background: var(--tarjeta-alta);
  color: var(--texto-fuerte);
  font-weight: 700;
}

/* La línea azul. Va como pseudo-elemento y no como border-bottom para que no
   empuje el texto ni un píxel al aparecer y desaparecer: está posicionada
   encima, no dentro del flujo. */
.pestana.activa::after {
  content: '';
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 6px;
  width: 20px; height: 2px;
  border-radius: 2px;
  background: var(--acento);
}

/* El contador de pendientes ahí mismo, en la pestaña. Así sabes si hay
   algo esperándote sin tener que entrar a mirar. */
.pestana .cuantas {
  font-size: 12px;
  color: var(--acento);
  font-variant-numeric: tabular-nums;
}

/* Cambiar de sección = esconder una lista y mostrar la otra.
   El "hidden" del HTML hace el trabajo; esto solo se asegura de que
   nada lo sobrescriba. */
[hidden] { display: none !important; }

/* Los paneles de copia y cuenta son cosa de los hábitos. En pendientes
   estorban, así que no aparecen aunque estés en modo edición. */
body.vista-tareas .panel-datos { display: none; }

/* --- El campo para escribir un pendiente ---
   Va siempre visible arriba de la lista, no dentro de una ventana.
   Es a propósito: anotar algo tiene que costar un toque, no tres. */
.nueva-tarea {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

/* El input global trae margen abajo y aquí no lo queremos: el margen
   lo pone .nueva-tarea para los dos elementos a la vez. */
.nueva-tarea input[type=text] { margin-bottom: 0; }

/* Safari mete un iconito de llave dentro de los campos donde cree que
   podrías querer rellenar una contraseña. Aquí no aplica nunca, así que
   lo escondemos. Es un pseudo-elemento propio de Safari/Chrome: el
   prefijo -webkit- significa "esto solo lo entienden estos navegadores". */
#tareaNueva::-webkit-credentials-auto-fill-button,
#tareaNueva::-webkit-contacts-auto-fill-button {
  visibility: hidden;
  pointer-events: none;
  width: 0;
  margin: 0;
}

.nueva-tarea button {
  flex: 0 0 52px;
  border-radius: 13px;
  border: none;
  background: var(--acento);
  color: var(--sobre-acento);
  font-size: 22px; font-family: inherit;
  cursor: pointer;
}

/* --- La tarjeta de un pendiente ---
   Más baja que la de un hábito: no lleva puntitos ni racha, solo
   texto. Una tarea no tiene historial que enseñar. */
.tarea {
  background: var(--tarjeta);
  border: 1px solid var(--borde);
  border-radius: 16px;
  padding: 13px 15px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 13px;
  transition: transform .12s ease, background .2s ease;
}

.tarea:active { transform: scale(0.98); }

/* Las hechas se hunden, igual que un hábito cumplido. Mismas señales
   visuales en las dos secciones = una sola regla que aprender. */
.tarea.hecha {
  background: var(--tarjeta-hecha);
  border-color: var(--exito-borde);
  box-shadow: inset 3px 0 0 var(--exito);
  opacity: .62;
}

.tarea.hecha .tarea-texto {
  color: var(--texto-suave);
  text-decoration: line-through;
}

/* El título y la nota van juntos en un bloque, para que el círculo y los
   botones queden centrados respecto a los dos y no solo respecto al título. */
.tarea-info { flex: 1; min-width: 0; }

.tarea-texto {
  font-size: 16px;
  font-weight: 500;
  /* A diferencia del nombre de un hábito, un pendiente puede ser largo
     ("llamar al del seguro del carro"). Que baje de línea en vez de
     cortarse con puntos suspensivos. */
  overflow-wrap: anywhere;
  line-height: 1.35;
}

body.editando .tarea-texto {
  border-bottom: 1px dashed var(--borde);
  display: inline-block;
}

/* Al marcar una tarea, esta se va al final de la lista. Como redibujamos
   todo de golpe, sin esto la tarjeta simplemente "aparecería" abajo y se
   sentiría un salto. Esta animación corta dice "me moví a propósito". */
@keyframes aterrizar {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.tarea.recien-movida { animation: aterrizar .28s ease-out; }

/* En Ideas, tocar el texto abre su ficha en vez de marcarla. El punteado es
   la pista de que ahí se puede tocar — la misma señal que la app ya usa en
   modo edición, para no tener que aprender un símbolo nuevo. */
.tarea.idea .tarea-texto {
  border-bottom: 1px dashed var(--borde);
  display: inline-block;
}

/* El comienzo de la nota, debajo del título. Sirve para reconocer la idea
   sin abrirla. Se corta a dos líneas: si creciera, la lista dejaría de ser
   una lista. */
.tarea-nota {
  font-size: 12.5px;
  color: var(--texto-suave);
  line-height: 1.45;
  margin-top: 5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* --- La ficha de una idea --- */
.modal textarea {
  width: 100%;
  min-height: 120px;
  padding: 14px;
  background: var(--fondo);
  border: 1px solid var(--borde);
  border-radius: 13px;
  color: var(--texto);
  font-size: 16px;          /* 16px evita que el iPhone haga zoom al escribir */
  font-family: inherit;
  line-height: 1.5;
  resize: vertical;
  margin-bottom: 18px;
  -webkit-user-select: text; user-select: text;
}

.modal textarea:focus { outline: none; border-color: var(--acento); }

/* Los dos botones secundarios de la ficha, en una fila aparte del Guardar.
   Mover y borrar son acciones poco frecuentes: no compiten por el sitio
   principal, pero tampoco se esconden. */
.ficha-acciones { display: flex; gap: 10px; margin-bottom: 12px; }

.ficha-acciones .btn-mini { flex: 1; }

.btn-peligro { color: var(--peligro); border-color: var(--peligro-borde); }

/* La flecha que manda una idea a Pendientes. Va siempre visible (no solo en
   modo edición) porque es LA acción de una idea: dejar de serlo. */
.mover {
  flex-shrink: 0;
  background: none;
  border: 1px solid var(--borde);
  border-radius: 10px;
  color: var(--acento);
  font-family: inherit;
  font-size: 15px; font-weight: 700;
  padding: 7px 11px;
  cursor: pointer;
}

.mover:active { background: var(--tarjeta-alta); }

/* En modo edición la flecha → se esconde. Con las dos de reordenar y la ✕ ya
   son tres botones, y un cuarto en el ancho de un iPhone hace que termines
   tocando el que no era. La → sigue estando en el uso normal, que es donde
   de verdad la usas. */
body.editando .mover { display: none; }

/* El botón de limpiar las hechas. Solo se dibuja si hay alguna. */
.limpiar-hechas {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  border-radius: 12px;
  border: 1px dashed var(--borde);
  background: none;
  color: var(--texto-suave);
  font-family: inherit;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
}

.limpiar-hechas:active { background: var(--tarjeta); }

/* ---------- 5. ESTADO VACÍO ---------- */
.vacio {
  text-align: center;
  padding: 60px 20px;
  color: var(--texto-suave);
}

.vacio-emoji { font-size: 44px; margin-bottom: 14px; }

/* ---------- 6. BOTONES DE ABAJO ---------- */
.barra-inferior {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--fondo) 65%, transparent);
  display: flex; gap: 10px;
  max-width: 620px; margin: 0 auto;
}

.btn {
  flex: 1;
  padding: 15px;
  border-radius: 15px;
  border: none;
  font-size: 15px; font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}

.btn-principal  { background: var(--acento); color: var(--sobre-acento); }
.btn-secundario { background: var(--tarjeta); color: var(--texto-suave);
                  border: 1px solid var(--borde); flex: 0 0 90px; }

/* ---------- 7. VENTANA PARA AGREGAR HÁBITO ---------- */
.fondo-modal {
  position: fixed; inset: 0;
  background: var(--velo);
  display: none;
  align-items: flex-end;
  z-index: 10;
}

.fondo-modal.abierto { display: flex; }

.modal {
  background: var(--tarjeta);
  width: 100%;
  border-radius: 26px 26px 0 0;
  padding: 26px 20px calc(26px + env(safe-area-inset-bottom));
  max-width: 620px; margin: 0 auto;
  animation: subir .25s cubic-bezier(.2,.8,.2,1);
}

@keyframes subir { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal h2 { font-size: 19px; margin-bottom: 18px; }

.etiqueta {
  font-size: 12px; color: var(--texto-suave);
  text-transform: uppercase; letter-spacing: 1px;
  font-weight: 600; margin-bottom: 8px; display: block;
}

input[type=text], input[type=email], input[type=password] {
  width: 100%;
  padding: 14px;
  background: var(--fondo);
  border: 1px solid var(--borde);
  border-radius: 13px;
  color: var(--texto);
  font-size: 16px; /* 16px evita que el iPhone haga zoom al escribir */
  font-family: inherit;
  margin-bottom: 18px;
  -webkit-user-select: text; user-select: text;
}

input[type=text]:focus, input[type=email]:focus, input[type=password]:focus {
  outline: none; border-color: var(--acento);
}

/* ---------- 10. PANEL DE CUENTA ---------- */
.panel-datos input { margin-bottom: 8px; }

.sesion-estado { font-size: 12px; margin-top: 10px; line-height: 1.5; }
.sesion-estado.error { color: var(--peligro); }
.sesion-estado.bien  { color: var(--exito); }

.emojis { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }

.emoji-op {
  width: 46px; height: 46px;
  border-radius: 13px;
  background: var(--fondo);
  border: 2px solid transparent;
  font-size: 22px;
  cursor: pointer;
  display: grid; place-items: center;
}

.emoji-op.elegido { border-color: var(--acento); }

/* ---------- 8. CALENDARIO MENSUAL ---------- */

/* El emoji del hábito ahora se puede tocar: abre su calendario.
   El borde tenue es la pista visual de que ahí se puede tocar. */
.habito-emoji { cursor: pointer; border: 1px solid var(--borde); }

.cal-cabecera {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.cal-cabecera h2 { margin-bottom: 2px; }

.cal-titulo-caja { flex: 1; min-width: 0; text-align: center; }

.cal-mes {
  font-size: 13px;
  color: var(--texto-suave);
  text-transform: capitalize;
}

.cal-flecha {
  background: var(--fondo);
  border: 1px solid var(--borde);
  color: var(--texto);
  width: 38px; height: 38px;
  border-radius: 12px;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
}

.cal-flecha:active { background: var(--tarjeta-alta); }

/* "grid" = cuadrícula. 7 columnas = los 7 días de la semana.
   Es la pieza clave: le decimos "7 columnas iguales" y los días
   se van acomodando solos, saltando de fila cuando toca. */
.cal-nombres, .cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.cal-nombres {
  margin-bottom: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--texto-suave);
  text-align: center;
  text-transform: uppercase;
}

.cal-dia {
  aspect-ratio: 1;          /* cuadrado perfecto, mida lo que mida */
  border-radius: 10px;
  border: 1px solid transparent;
  background: var(--fondo);
  color: var(--texto-suave);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: grid; place-items: center;
}

.cal-dia.hecho   { background: var(--exito); color: var(--sobre-exito); }
.cal-dia.hoy     { border-color: var(--acento); }
.cal-dia.futuro  { opacity: .25; cursor: default; }

/* Con el calendario y las estadísticas, la ventana creció.
   Esto evita que se salga de la pantalla en teléfonos pequeños. */
.modal { max-height: 92vh; overflow-y: auto; }

/* ---------- 9. ESTADÍSTICAS ----------
   auto-fit + minmax = "mete las columnas que quepan, mínimo 72px cada una".
   Así se acomodan solas: 4 en fila en un iPhone, 2 y 2 si la pantalla es
   más angosta. No hay que escribir ninguna regla para cada tamaño. */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
  gap: 8px;
  margin-top: 14px;
}

.stat {
  background: var(--fondo);
  border: 1px solid var(--borde);
  border-radius: 12px;
  padding: 10px 6px;
  text-align: center;
  cursor: pointer;
  font-family: inherit;
  color: var(--texto);
}

.stat.activa { border-color: var(--acento); }

/* La explicación que aparece al tocar una estadística.
   min-height reserva el espacio de dos líneas desde el principio: sin eso,
   la ventana daría un salto cada vez que aparece o desaparece el texto. */
.cal-ayuda {
  font-size: 12px;
  line-height: 1.5;
  color: var(--texto-suave);
  margin-top: 12px;
  min-height: 36px;
}

.stat-numero {
  font-size: 19px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;  /* que no bailen los números al cambiar */
}

.stat-etiqueta {
  font-size: 10px;
  color: var(--texto-suave);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-top: 3px;
  line-height: 1.3;
}
</style>
</head>

<body>

  <!-- ====== HTML: la estructura visible ====== -->

  <!-- La capa donde cae el confeti. Va aquí arriba, fuera de la lista, y no
       por casualidad: pintar() borra y rehace la lista entera cada vez que
       marcas algo. Si el confeti viviera dentro, se borraría a mitad de vuelo.
       aria-hidden le dice a VoiceOver que se la salte: no tiene información,
       solo adorno. -->
  <div class="confeti" id="confeti" aria-hidden="true"></div>

  <header>
    <div class="fecha" id="fecha"></div>
    <div class="titulo">Mis Hábitos</div>

    <div class="progreso-caja" id="cajaProgreso">
      <div class="progreso-texto">
        <span id="progresoEtiqueta">Hoy</span>
        <span id="progresoTexto">0 de 0</span>
      </div>
      <div class="progreso-fondo"><div class="progreso-barra" id="barra"></div></div>
    </div>

    <!-- Las tres secciones de la app, todas al mismo nivel: un toque para
         llegar a cualquiera. Solo Pendientes lleva contador — una idea sin
         hacer no es una deuda, así que no debe pesarte con un número. -->
    <div class="pestanas">
      <button class="pestana activa" id="pestanaHabitos" data-t="habitos">Hábitos</button>
      <button class="pestana" id="pestanaTareas"><span data-t="pendientes">Pendientes</span> <span class="cuantas" id="contadorTareas"></span></button>
      <button class="pestana" id="pestanaIdeas" data-t="ideas">Ideas</button>
    </div>
  </header>

  <!-- Aquí JavaScript va a insertar las tarjetas de hábitos -->
  <main id="lista"></main>

  <!-- Pendientes e Ideas comparten este mismo bloque: las dos son una lista de
       textos y solo cambian las palabras y a qué lista van. Duplicar el HTML
       para tener dos cosas idénticas sería la misma trampa que tener dos
       arrays. Arranca oculto: la app siempre abre en Hábitos. -->
  <main id="listaTareas" hidden>
    <!-- El campo de captura va arriba y siempre visible: escribir un
         pendiente tiene que ser un toque, no abrir una ventana. -->
    <!-- Va dentro de su propio <form> para quedar en un "recinto" distinto al
         del login. Así Safari deja de ofrecerte tu contraseña aquí.
         El name="pendiente" también cuenta: Safari adivina para qué sirve un
         campo por su nombre y su texto de ayuda, no solo por autocomplete. -->
    <form class="nueva-tarea" id="formTarea" autocomplete="off">
      <input type="text" id="tareaNueva" name="pendiente"
             placeholder="¿Qué tienes pendiente?"
             maxlength="120" autocomplete="off" enterkeyhint="done"
             autocorrect="off" data-lpignore="true">
      <button type="submit" id="btnAgregarTarea" data-aria="agregar">+</button>
    </form>

    <!-- Aquí JavaScript inserta las tarjetas de pendientes -->
    <div id="tareasCuerpo"></div>
  </main>

  <!-- Copia de seguridad. Solo se ve al tocar "Editar" -->
  <section class="panel-datos">
    <span class="etiqueta" data-t="copiaSeguridad">Copia de seguridad</span>
    <div class="panel-botones">
      <button class="btn-mini" id="btnExportar" data-t="guardarCopia">↓ Guardar copia</button>
      <button class="btn-mini" id="btnImportar" data-t="restaurarCopia">↑ Restaurar copia</button>
    </div>
    <!-- Este input abre el selector de archivos. Va oculto porque el
         botón de arriba es más bonito; al tocarlo, lo activamos desde JS -->
    <input type="file" id="archivoEntrada" accept=".json,application/json" hidden>
    <p class="nota" data-t="notaCopia">Si entras a tu cuenta, tus datos se sincronizan solos con la
      nube. Esta copia es el respaldo que no depende de nadie más: un archivo tuyo, guardado donde
      tú quieras.</p>
  </section>

  <!-- Ajustes. Va en modo edición igual que los otros dos paneles, y por la
       misma razón: el idioma, el tema y tu nombre se tocan una vez y no se
       vuelven a mirar. Meterlos en una pestaña propia habría agregado un
       cuarto botón permanente arriba para algo que casi nunca se usa. -->
  <section class="panel-datos">
    <span class="etiqueta" data-t="ajustes">Ajustes</span>

    <span class="sub-etiqueta" data-t="tuNombre">Tu nombre</span>
    <input type="text" id="ajusteNombre" maxlength="20" autocomplete="off"
           data-ph="phNombre" placeholder="Para el saludo de arriba">

    <span class="sub-etiqueta" data-t="idioma">Idioma</span>
    <div class="segmentado dos" id="idiomas"></div>

    <span class="sub-etiqueta" data-t="apariencia">Apariencia</span>
    <div class="segmentado tres" id="temas"></div>
  </section>

  <!-- Cuenta. También solo en modo edición: entrar es algo que se hace
       una vez por dispositivo, no todos los días. -->
  <section class="panel-datos">
    <span class="etiqueta" data-t="cuenta">Cuenta</span>

    <!-- Lo que se ve cuando NO has entrado.
         Los dos campos van dentro de un <form> a propósito. Sin él, Safari
         trata la página entera como un formulario y ofrece rellenar tu
         contraseña en CUALQUIER campo de texto, incluido el de escribir un
         pendiente. El <form> le pone una cerca a las credenciales. -->
    <div id="sesionFuera" hidden>
      <form id="formEntrar">
        <input type="email" id="correo" name="correo" data-ph="phCorreo" placeholder="tu@correo.com"
               autocomplete="username" autocapitalize="none" spellcheck="false">
        <input type="password" id="clave" name="clave" data-ph="phClave" placeholder="Contraseña"
               autocomplete="current-password">
        <div class="panel-botones">
          <button class="btn-mini" id="btnEntrar" type="submit" data-t="entrar">Entrar</button>
        </div>
      </form>
    </div>

    <!-- Lo que se ve cuando SÍ has entrado -->
    <div id="sesionDentro" hidden>
      <div class="panel-botones">
        <button class="btn-mini" id="btnSalir" data-t="cerrarSesion">Cerrar sesión</button>
      </div>
    </div>

    <p class="sesion-estado" id="sesionEstado"></p>
  </section>

  <div class="barra-inferior">
    <button class="btn btn-principal"  id="btnAgregar">+ Nuevo hábito</button>
    <button class="btn btn-secundario" id="btnEditar" data-t="editar">Editar</button>
  </div>

  <!-- Ventana emergente para crear un hábito -->
  <div class="fondo-modal" id="modal">
    <div class="modal">
      <h2 data-t="nuevoHabito">Nuevo hábito</h2>

      <label class="etiqueta" for="nombre" data-t="nombre">Nombre</label>
      <input type="text" id="nombre" data-ph="phNombreHabito" placeholder="Ej: Leer 20 minutos" maxlength="40" autocomplete="off">

      <label class="etiqueta" data-t="icono">Ícono</label>
      <div class="emojis" id="emojis"></div>

      <!-- La escotilla de escape: si ninguno de arriba sirve, escribe el
           tuyo con el teclado de emojis del teléfono. Lo que escribas aquí
           tiene prioridad sobre el que esté seleccionado. -->
      <input type="text" id="emojiLibre" maxlength="8" autocomplete="off"
             data-ph="phEmojiLibre" placeholder="…o escribe el tuyo 😀">

      <div style="display:flex; gap:10px">
        <button class="btn btn-secundario" id="btnCancelar" style="flex:1" data-t="cancelar">Cancelar</button>
        <button class="btn btn-principal"  id="btnGuardar" data-t="guardar">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Calendario de un hábito. Se abre al tocar su emoji.
       Los días se generan desde JavaScript, por eso calGrid va vacío. -->
  <div class="fondo-modal" id="modalCal">
    <div class="modal">
      <div class="cal-cabecera">
        <button class="cal-flecha" id="calAtras">‹</button>
        <div class="cal-titulo-caja">
          <h2 id="calTitulo">Hábito</h2>
          <div class="cal-mes" id="calMes"></div>
        </div>
        <button class="cal-flecha" id="calAdelante">›</button>
      </div>

      <!-- Las letras de los días las pone JavaScript: cambian con el idioma.
           La semana sigue empezando en lunes en los dos idiomas — cambiar el
           primer día tocaría columnaInicio() y sus pruebas, y no es lo que
           estamos haciendo hoy. -->
      <div class="cal-nombres" id="calNombres"></div>

      <div class="cal-grid" id="calGrid"></div>

      <p class="nota" id="calResumen"></p>

      <!-- Estadísticas del hábito. Los números los pone JavaScript. -->
      <div class="stats" id="calStats"></div>
      <p class="cal-ayuda" id="calAyuda"></p>

      <button class="btn btn-secundario" id="calCerrar" data-t="cerrar"
              style="width:100%; flex:none; margin-top:16px">Cerrar</button>
    </div>
  </div>

  <!-- La ficha de una idea. Se abre al tocar su texto en la lista.
       Aquí vive todo lo que se hace con una idea: cambiarle el título,
       escribirle el contexto, mandarla a Pendientes o borrarla. -->
  <div class="fondo-modal" id="modalIdea">
    <div class="modal">
      <h2 data-t="idea">Idea</h2>

      <label class="etiqueta" for="ideaTexto" data-t="idea">Idea</label>
      <input type="text" id="ideaTexto" maxlength="120" autocomplete="off">

      <label class="etiqueta" for="ideaNota" data-t="contexto">Contexto</label>
      <textarea id="ideaNota" maxlength="500" data-ph="phContexto"
                placeholder="¿Por qué te pareció buena? ¿Qué problema resuelve? Lo que sea que quieras recordar dentro de un mes."></textarea>

      <div class="ficha-acciones">
        <button class="btn-mini" id="ideaMover" data-t="aPendientes">→ A Pendientes</button>
        <button class="btn-mini btn-peligro" id="ideaBorrar" data-t="borrar">Borrar</button>
      </div>

      <div style="display:flex; gap:10px">
        <button class="btn btn-secundario" id="ideaCancelar" style="flex:1" data-t="cancelar">Cancelar</button>
        <button class="btn btn-principal"  id="ideaGuardar" data-t="guardar">Guardar</button>
      </div>
    </div>
  </div>

<script>
/* ============================================================
   JAVASCRIPT — la lógica de la app
   Leelo de arriba a abajo, está en orden de importancia.
   ============================================================ */

/* ---------- A0. LOS TEXTOS EN LOS DOS IDIOMAS ----------
   Aquí no hay ningún traductor automático: cada frase está escrita a mano en
   español y en inglés. Es más trabajo una vez y sale bien; un traductor
   convertiría "racha" en cualquier cosa menos en "streak".

   Piénsalo como una hoja de Excel con tres columnas: clave, español, inglés.
   El código nunca pide "Buenos días": pide la fila `saludoManana` y esta tabla
   decide qué palabra sale según el idioma activo.

   REGLA PARA EL FUTURO, y es la importante: **ningún texto que vea el usuario
   se escribe suelto en el código.** Se le pone una clave aquí y se llama con
   t('clave'). Si un texto se cuela sin traducir, la app queda mitad en español
   y mitad en inglés, que se ve peor que estar entera en el idioma equivocado.

   Los emojis no se traducen: 🌱 significa lo mismo en los dos idiomas.        */

const TEXTOS = {
  es: {
    // --- Cabecera y navegación ---
    tituloApp: 'Mis Hábitos',
    saludoManana: 'Buenos días', saludoTarde: 'Buenas tardes', saludoNoche: 'Buenas noches',
    hoy: 'Hoy', de: 'de',
    habitos: 'Hábitos', pendientes: 'Pendientes', ideas: 'Ideas',

    // --- Hábitos ---
    nuevoHabito: '+ Nuevo hábito', tituloNuevoHabito: 'Nuevo hábito',
    nombre: 'Nombre', icono: 'Ícono',
    phNombreHabito: 'Ej: Leer 20 minutos',
    phEmojiLibre: '…o escribe el tuyo 😀',
    editar: 'Editar', listo: 'Listo',
    guardar: 'Guardar', cancelar: 'Cancelar', cerrar: 'Cerrar', borrar: 'Borrar',
    vacioHabitos: 'Aún no tienes hábitos.<br>Empieza con uno o dos, no más.',
    promptNombre: 'Nuevo nombre para el hábito:',
    promptEmoji: 'Nuevo emoji para',
    emojiInvalido: 'Eso no parece un emoji. Usa el teclado de emojis del teléfono.',

    // --- Pendientes e ideas ---
    agregar: 'Agregar',
    phPendiente: '¿Qué tienes pendiente?', phIdea: '¿Qué se te ocurrió?',
    nuevoPendiente: '+ Nuevo pendiente', nuevaIdea: '+ Nueva idea',
    vacioPendientes: 'Nada pendiente.<br>Escribe algo arriba cuando aparezca.',
    vacioIdeas: 'Sin ideas guardadas.<br>Apunta lo que se te ocurra, sin compromiso.',
    promptPendiente: 'Cambiar el pendiente:',

/* Devuelve el texto de una clave en el idioma activo.

   El `!== undefined` del final es una red de seguridad: si algún día agregas
   una clave al español y se te olvida en inglés, sale la palabra en español en
   vez de la clave cruda. Ver "aUltimos30" en pantalla sería mucho peor.       */
function t(clave) {
  const idioma = (typeof datos !== 'undefined' && datos.prefs && datos.prefs.idioma) || 'es';
  const tabla = TEXTOS[idioma] || TEXTOS.es;
  return tabla[clave] !== undefined ? tabla[clave] : TEXTOS.es[clave];
}

/* Los idiomas se escriben SIEMPRE en su propio idioma. Si alguien abre la app
   en inglés sin entenderlo, "Español" lo reconoce igual; "Spanish" no le sirve
   de nada para volver. */
const IDIOMAS = [
  { id: 'es', nombre: 'Español' },
  { id: 'en', nombre: 'English' }
];

const TEMAS = [
  { id: 'auto',   clave: 'temaAuto' },
  { id: 'claro',  clave: 'temaClaro' },
  { id: 'oscuro', clave: 'temaOscuro' }
];

/* El idioma con el que el navegador escribe las fechas ("viernes, 7 de agosto"
   contra "Friday, August 7"). Lleva país y no solo idioma a propósito: "es" a
   secas deja al navegador elegir convenciones, y con "es-CO" / "en-US" sabes
   exactamente qué vas a ver.

   Esta función existe para no repetir ese condicional en los dos sitios donde
   se formatean fechas (la cabecera y el título del calendario). El día que
   agregues un tercer idioma, se cambia aquí y ya. */
function localeFechas() {
  return (datos.prefs && datos.prefs.idioma) === 'en' ? 'en-US' : 'es-CO';
}
/* ---------- fin A0 ---------- */

/* ---------- A. GUARDAR Y LEER DATOS ----------
   localStorage solo guarda TEXTO. Por eso convertimos nuestro
   objeto a texto con JSON.stringify al guardar, y de texto a
   objeto con JSON.parse al leer.                                */

const CLAVE = 'habitos-app-v1';

// Esta es la "forma" de nuestros datos. Piénsalo como tablas:
//   habitos  -> una fila por hábito
//   registros-> qué hábitos se marcaron en cada fecha
//   tareas   -> una fila por pendiente (la segunda sección de la app)
// "pendientes" es la cola de cambios que faltan por subir a la nube.
//
// OJO con los nombres, porque se parecen y no son lo mismo:
//   datos.tareas     = tu lista de cosas por hacer (lo que ves en pantalla)
//   datos.pendientes = cambios que faltan por subir a Supabase (interno)
//
// "prefs" son los ajustes de ESTE dispositivo: idioma, tema y tu nombre. No
// son datos de hábitos, y por eso más abajo verás que ni se importan de una
// copia ni se bajan de la nube: si entras desde el Mac en inglés y desde el
// iPhone en español, cada uno se queda como lo dejaste.
const PREFS_POR_DEFECTO = { idioma: 'es', tema: 'auto', nombre: '' };

const datosPorDefecto = {
  version: 1, habitos: [], registros: {}, tareas: [], pendientes: [],
  prefs: { ...PREFS_POR_DEFECTO }
};

function cargar() {
  try {
    const texto = localStorage.getItem(CLAVE);
    const leidos = texto ? JSON.parse(texto) : structuredClone(datosPorDefecto);

    // Los datos guardados antes de la Fase 3 no traen cola. Se la ponemos
    // al vuelo en vez de obligarte a borrar y empezar de cero.
    if (!Array.isArray(leidos.pendientes)) leidos.pendientes = [];

    // Lo mismo con la lista de tareas: los datos guardados antes de que
    // existiera la sección de Pendientes no la traen. Este patrón se repite
    // cada vez que agregamos algo al modelo, y es lo que permite estrenar
    // una función sin que pierdas lo que ya tenías.
    if (!Array.isArray(leidos.tareas)) leidos.tareas = [];

    // Y lo mismo una capa más adentro: las tareas guardadas antes de que
    // existieran las Ideas no tienen la columna "lista". Todas eran
    // pendientes, así que ese es su valor. En SQL esto sería el
    // UPDATE tareas SET lista = 'pendientes' WHERE lista IS NULL
    // que corres una vez al agregar una columna a una tabla que ya tiene datos.
    leidos.tareas.forEach(tarea => { if (!tarea.lista) tarea.lista = 'pendientes'; });

    // Y otra vez el mismo patrón para los ajustes, que nacen en la v15. El
    // orden del "spread" importa: primero los valores por defecto, encima lo
    // que hubiera guardado. Así una preferencia nueva entra con su valor de
    // fábrica sin borrar las que ya elegiste.
    leidos.prefs = { ...PREFS_POR_DEFECTO, ...(leidos.prefs || {}) };

    return leidos;
  } catch (e) {
    // Si algo se corrompe, mejor arrancar limpio que romperse
    console.error('No se pudieron leer los datos:', e);
    return structuredClone(datosPorDefecto);
  }
}

function guardar() {
  localStorage.setItem(CLAVE, JSON.stringify(datos));
}

/* La idea central de la sincronización, en una función.
   Cada cambio se guarda en el teléfono Y se anota en una cola de "esto
   falta subirlo". Si hay señal, la cola se vacía enseguida. Si no, la
   nota espera ahí, guardada, hasta que vuelva. Por eso la app se siente
   igual de rápida sin internet: nunca espera a la nube para nada.

   El "if" del final es lo que mantiene esta sección independiente: la
   cola existe aunque la nube no haya cargado o ni siquiera exista. */
function encolar(pendiente) {
  datos.pendientes.push(pendiente);
  guardar();
  if (typeof pedirSincronizar === 'function') pedirSincronizar();
}

let datos = cargar();

/* ---------- B. FECHAS ----------
   Usamos el formato "2026-08-01" (año-mes-día) porque así las
   fechas se ordenan solas alfabéticamente. Es el mismo formato
   DATE de SQL, te va a resultar familiar.                       */

function claveFecha(fecha) {
  const y = fecha.getFullYear();
  const m = String(fecha.getMonth() + 1).padStart(2, '0'); // los meses van de 0 a 11
  const d = String(fecha.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function hoy() { return claveFecha(new Date()); }

function haceNDias(n) {
  const f = new Date();
  f.setDate(f.getDate() - n);
  return claveFecha(f);
}

/* --- Fechas para el calendario ---
   Aquí el mes va de 1 a 12 (como lo dirías hablando), no de 0 a 11
   como lo maneja JavaScript por dentro. Es una decisión: prefiero
   traducir en un solo sitio a estar restando 1 por todo el código. */

// Arma la clave de fecha a partir de tres números sueltos.
function claveDe(anio, mes, dia) {
  return `${anio}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
}

// ¿Cuántos días tiene este mes? Truco clásico: pedirle a JavaScript
// el "día 0" del mes siguiente. El día 0 no existe, así que retrocede
// uno y cae en el último día del mes que queremos. Así no hay que
// acordarse de febrero ni de los años bisiestos.
function diasDelMes(anio, mes) {
  return new Date(anio, mes, 0).getDate();
}

// ¿En qué columna empieza el día 1? La semana la mostramos de lunes a
// domingo, pero getDay() cuenta 0=domingo ... 6=sábado. El (+6) % 7
// rota esa numeración para que el lunes quede en 0.
function columnaInicio(anio, mes) {
  const diaSemana = new Date(anio, mes - 1, 1).getDay();
  return (diaSemana + 6) % 7;
}

// Comparar fechas es comparar texto, y funciona: al estar en formato
// AAAA-MM-DD, el orden alfabético coincide con el cronológico. Es la
// misma razón por la que elegimos este formato desde el principio.
function esFutura(fecha) {
  return fecha > hoy();
}

/* ---------- C. CONSULTAS SOBRE LOS DATOS ---------- */

// ¿Este hábito está marcado en esta fecha?
function estaHecho(idHabito, fecha) {
  const delDia = datos.registros[fecha] || [];
  return delDia.includes(idHabito);
}

// ¿Están marcados TODOS los hábitos en esta fecha?
//
// Sin hábitos devuelve false, y eso es una decisión, no un descuido: una lista
// vacía cumple "todos están marcados" por pura lógica (`every` sobre nada es
// siempre true), y la app te felicitaría por no tener hábitos. El caso vacío
// hay que pensarlo aparte casi siempre.
//
// Es una función pura: solo lee y devuelve un sí o un no. Por eso se puede
// probar sin abrir la app, que es justo lo que la hace confiable — la
// animación no se puede probar, pero la condición que la dispara sí.
function diaCompleto(fecha) {
  if (datos.habitos.length === 0) return false;
  return datos.habitos.every(h => estaHecho(h.id, fecha));
}

// Todas las fechas en que se marcó un hábito, ordenadas de vieja a nueva.
// En SQL: SELECT fecha FROM registros WHERE habito = ? ORDER BY fecha
// Ordenar textos AAAA-MM-DD ya los deja en orden cronológico.
function fechasDe(idHabito) {
  return Object.keys(datos.registros)
    .filter(f => datos.registros[f].includes(idHabito))
    .sort();
}

// Cuántos días en total se ha marcado. El COUNT(*) de toda la vida.
function totalDias(idHabito) {
  return fechasDe(idHabito).length;
}

// Cuántos días hay entre dos fechas.
// Ojo con el 'T00:00:00': sin eso, JavaScript interpreta "2026-08-04" como
// medianoche en Londres, y en Colombia eso cae el día anterior. Agregándolo
// se lee como medianoche local, que es lo que queremos.
// El Math.round es por el horario de verano: en los países que lo usan hay
// días de 23 o 25 horas y la división daría 30.958 en vez de 31.
function diasEntre(desde, hasta) {
  const a = new Date(desde + 'T00:00:00');
  const b = new Date(hasta + 'T00:00:00');
  return Math.round((b - a) / 86400000);   // milisegundos que tiene un día
}

// La racha más larga que ha logrado, en toda su historia.
// La idea: recorrer sus fechas en orden y llevar dos cuentas — la racha que
// viene corriendo y la mejor vista hasta ahora. Cada vez que un día NO es el
// siguiente del anterior, la racha se reinicia en 1.
function mejorRacha(idHabito) {
  const fechas = fechasDe(idHabito);
  let mejor = 0;
  let corriendo = 0;
  let anterior = null;

  for (const f of fechas) {
    // ¿este día es exactamente el siguiente del anterior?
    if (anterior !== null && diasEntre(anterior, f) === 1) corriendo++;
    else corriendo = 1;

    if (corriendo > mejor) mejor = corriendo;
    anterior = f;
  }
  return mejor;
}

// Desde qué día "cuenta" este hábito, para calcular porcentajes justos.
// Normalmente es su fecha de creación, pero tomamos la más antigua entre esa
// y su primer día marcado: con el calendario ahora puedes marcar días
// anteriores a la creación, y si no, el porcentaje se pasaría de 100%.
function fechaInicio(idHabito) {
  const h = datos.habitos.find(x => x.id === idHabito);
  const candidatas = [h && h.creado, fechasDe(idHabito)[0]].filter(Boolean).sort();
  return candidatas[0] || hoy();
}

// Cuántos días lleva vivo el hábito, contando hoy.
function diasDeVida(idHabito) {
  return diasEntre(fechaInicio(idHabito), hoy()) + 1;   // +1 para incluir el día de inicio
}

// Porcentaje de cumplimiento en los últimos n días.
// Si el hábito es más nuevo que n, medimos solo desde que existe: no tiene
// sentido castigarlo por días en los que todavía no lo habías creado.
function porcentajeUltimos(idHabito, n) {
  const dias = Math.min(n, diasDeVida(idHabito));
  if (dias <= 0) return 0;

  let hechos = 0;
  for (let i = 0; i < dias; i++) {
    if (estaHecho(idHabito, haceNDias(i))) hechos++;
  }
  return Math.round(hechos / dias * 100);
}

// Cuántos días seguidos lleva. Si hoy todavía no lo marca, la racha
// de ayer hacia atrás sigue contando (no lo castigamos a las 8am).
function calcularRacha(idHabito) {
  let racha = 0;
  let inicio = estaHecho(idHabito, hoy()) ? 0 : 1;
  for (let i = inicio; i < 3650; i++) {
    if (estaHecho(idHabito, haceNDias(i))) racha++;
    else break;
  }
  return racha;
}

// Cuántas veces se marcó este hábito en un mes concreto.
// En SQL sería: SELECT COUNT(*) ... WHERE fecha LIKE '2026-08%'
function contarMes(idHabito, anio, mes) {
  let total = 0;
  for (let d = 1; d <= diasDelMes(anio, mes); d++) {
    if (estaHecho(idHabito, claveDe(anio, mes, d))) total++;
  }
  return total;
}

/* ---------- D. ACCIONES (cambian los datos) ---------- */

// Marca o desmarca un hábito en CUALQUIER fecha, no solo hoy.
// Devuelve true si cambió algo, false si no se permitió.
function alternarFecha(idHabito, fecha) {
  if (esFutura(fecha)) return false;   // el futuro no se marca

  // Foto del "antes", tomada antes de tocar nada. Lo que se celebra es el
  // MOMENTO en que el día se completa, no el hecho de estar completo. Sin
  // esta foto no hay forma de distinguir las dos cosas, y el confeti saldría
  // cada vez que tocaras cualquier hábito de un día ya terminado.
  const estabaCompleto = diaCompleto(fecha);

  if (!datos.registros[fecha]) datos.registros[fecha] = [];

  const posicion = datos.registros[fecha].indexOf(idHabito);
  const marcando = posicion === -1;
  if (marcando) {
    datos.registros[fecha].push(idHabito);                      // marcar
    encolar({ tipo: 'marcar', id: idHabito, fecha: fecha });
  } else {
    datos.registros[fecha].splice(posicion, 1);                 // desmarcar
    encolar({ tipo: 'desmarcar', id: idHabito, fecha: fecha });
  }

  // Si el día quedó sin nada, borramos la clave entera: no vale la pena
  // guardar filas vacías. Mantiene la copia de seguridad limpia.
  if (datos.registros[fecha].length === 0) delete datos.registros[fecha];

  // La animación chica, solo al marcar: desmarcar no tiene nada que celebrar.
  // No se aplica aquí directamente porque pintar() rehace las tarjetas desde
  // cero y se llevaría por delante cualquier clase puesta antes. Se anota
  // cuál fue y pintar() la aplica al construirla — el mismo truco que
  // tareaRecienMovida usa en Pendientes.
  habitoRecienMarcado = marcando ? idHabito : null;

  guardar();
  pintar();

  // Y la grande. Tres condiciones, cada una por su motivo:
  //   marcando           -> desmarcar nunca completa nada
  //   fecha === hoy()    -> corregir un martes pasado desde el calendario no
  //                         es "quedar al día"; es arreglar el pasado
  //   !estabaCompleto    -> la transición, no el estado
  if (marcando && fecha === hoy() && !estabaCompleto && diaCompleto(fecha)) {
    celebrarDiaCompleto();
  }
  return true;
}

// Marcar hoy pasa a ser un caso particular de lo anterior.
function alternarHoy(idHabito) {
  return alternarFecha(idHabito, hoy());
}

function agregarHabito(nombre, emoji) {
  const id = crypto.randomUUID();   // un identificador único, como una PRIMARY KEY
  datos.habitos.push({ id: id, nombre: nombre, emoji: emoji, creado: hoy() });

  encolar({ tipo: 'guardarHabito', id: id });
  guardar();
  pintar();
}

// Cambia el nombre de un hábito. Devuelve true si cambió algo.
// El historial no se toca: vive atado al id, no al nombre. Es la ventaja de
// haber usado un id como PRIMARY KEY en vez del nombre.
function renombrarHabito(idHabito, nombreNuevo) {
  const limpio = (nombreNuevo || '').trim();
  if (!limpio) return false;                 // un nombre vacío no sirve

  const h = datos.habitos.find(x => x.id === idHabito);
  if (!h) return false;
  if (h.nombre === limpio) return false;     // no cambió nada, no guardamos

  h.nombre = limpio.slice(0, 40);            // el mismo tope que el formulario

  encolar({ tipo: 'guardarHabito', id: idHabito });
  guardar();
  pintar();
  return true;
}

// Cambia el emoji de un hábito. Igual que renombrar: el historial no se
// mueve, porque cuelga del id y no de cómo se ve el hábito.
function cambiarEmoji(idHabito, emojiNuevo) {
  const simbolo = primerEmoji(emojiNuevo);
  if (!simbolo) return false;                // no era un emoji: no tocamos nada

  const h = datos.habitos.find(x => x.id === idHabito);
  if (!h || h.emoji === simbolo) return false;

  h.emoji = simbolo;
  encolar({ tipo: 'guardarHabito', id: idHabito });
  guardar();
  pintar();
  return true;
}

// Sube o baja un hábito en la lista. direccion: -1 sube, +1 baja.
// El orden en pantalla es simplemente el orden del array datos.habitos,
// así que mover un hábito es intercambiarlo con su vecino.
function moverHabito(idHabito, direccion) {
  const i = datos.habitos.findIndex(x => x.id === idHabito);
  if (i === -1) return false;

  const j = i + direccion;
  if (j < 0 || j >= datos.habitos.length) return false;   // ya está en el extremo

  // Intercambio de dos posiciones en una línea. Se lee así:
  // "que el de la izquierda pase a valer lo de la derecha, y viceversa".
  [datos.habitos[i], datos.habitos[j]] = [datos.habitos[j], datos.habitos[i]];

  // Los dos que se intercambiaron cambiaron de posición, así que hay que
  // subir los dos. La posición se lee al momento de enviar, no ahora.
  encolar({ tipo: 'guardarHabito', id: datos.habitos[i].id });
  encolar({ tipo: 'guardarHabito', id: datos.habitos[j].id });

  guardar();
  pintar();
  return true;
}

function borrarHabito(idHabito) {
  const h = datos.habitos.find(x => x.id === idHabito);
  if (!confirm(`¿Borrar "${h.nombre}"? Se pierde su historial.`)) return;

  datos.habitos = datos.habitos.filter(x => x.id !== idHabito);
  // También limpiamos su historial de todas las fechas
  for (const fecha in datos.registros) {
    datos.registros[fecha] = datos.registros[fecha].filter(x => x !== idHabito);
  }

  // En la nube basta con borrar el hábito: el "on delete cascade" de la
  // tabla registros se lleva su historial solo. Ese bucle de arriba existe
  // porque localStorage no sabe hacer eso.
  encolar({ tipo: 'borrarHabito', id: idHabito });

  guardar();
  pintar();
}

/* ---------- D2. PENDIENTES E IDEAS: LA LÓGICA ----------
   Esta es toda la inteligencia de las dos listas de texto. Está aquí arriba,
   junto al resto de la lógica, y no abajo con el dibujado, por una razón muy
   práctica: lo de aquí se puede probar con "node pruebas.js" y lo de abajo no.
   Una función que solo mueve datos se prueba sola; una que dibuja en pantalla
   hay que mirarla con los ojos.

   Una tarea es deliberadamente pobre:
     { id, texto, hecha, creada, lista }
   Sin emoji, sin fecha límite, sin prioridad. Un hábito necesita historial
   porque su gracia es repetirse; una tarea se hace una vez y se acabó.

   POR QUÉ UN SOLO ARRAY Y NO DOS.
   Los pendientes y las ideas guardan exactamente los mismos campos. Cuando dos
   tablas tienen las mismas columnas, casi nunca son dos tablas: son una tabla
   con una columna más. Así que en vez de datos.tareas y datos.ideas por
   separado, hay un solo array con una columna "lista" que dice a cuál pertenece
   cada fila. En SQL sería la diferencia entre:

     SELECT * FROM ideas                          (dos tablas gemelas)
     SELECT * FROM tareas WHERE lista = 'ideas'   (una tabla y un WHERE)

   Lo que se gana con la segunda: mover una idea a pendientes es cambiar un
   campo (un UPDATE), no borrarla de un sitio y crearla en otro. Y toda la
   lógica de abajo sirve para las dos listas con solo pasarle cuál.

   Desde la v16 estas funciones SÍ encolan: pendientes e ideas ya tienen su
   propia tabla en Postgres, igual que los hábitos. Se esperó a usarlas unos
   días antes de decidirlo, que era justo el plan.

   Ojo con el `orden`. Un array tiene orden por sí mismo; una tabla no, hay que
   guardarlo en una columna. Aquí el orden de una tarea es su posición dentro
   de datos.tareas, así que **cualquier cosa que corra las posiciones obliga a
   volver a subir las que se movieron**. De eso se encarga encolarTareasDesde().
   Si se olvidara, la nube devolvería las tareas en un orden que ya no es el
   tuyo, y lo peor es que no te enterarías hasta abrir la app en otro aparato. */

// Vuelve a encolar las tareas desde una posición en adelante, porque son
// justo las que cambiaron de sitio dentro del array. Borrar la número 3 corre
// a la 4, la 5 y la 6; las anteriores no se enteran, así que no hace falta
// tocarlas. Subir de a poco en vez de subirlo todo es la diferencia entre una
// petición y treinta.
function encolarTareasDesde(indice) {
  for (let i = Math.max(0, indice); i < datos.tareas.length; i++) {
    encolar({ tipo: 'guardarTarea', id: datos.tareas[i].id });
  }
}


// Los dos valores válidos de la columna "lista", en un solo sitio. Si algún día
// aparece una tercera, se agrega aquí y no hay que buscar textos sueltos por
// todo el archivo.
const LISTAS = { pendientes: 'pendientes', ideas: 'ideas' };

// El WHERE de arriba, en JavaScript. Devuelve solo las filas de una lista.
function tareasDe(lista) {
  return datos.tareas.filter(tarea => tarea.lista === lista);
}

function agregarTarea(texto, lista) {
  const limpio = (texto || '').trim();
  if (!limpio) return false;              // una tarea vacía no es una tarea

  const id = crypto.randomUUID();
  datos.tareas.push({
    id: id,
    texto: limpio.slice(0, 120),          // el mismo tope que el campo del HTML
    hecha: false,
    creada: hoy(),
    // Si no dicen a cuál lista va, es un pendiente. Los valores por defecto
    // sirven para que quien llame a la función no tenga que pensar en el caso
    // normal, solo en el excepcional.
    lista: lista === LISTAS.ideas ? LISTAS.ideas : LISTAS.pendientes
  });

  // Entra al final, así que no corre a nadie: basta con encolar esta.
  encolar({ tipo: 'guardarTarea', id: id });
  guardar();
  pintarLista();
  return true;
}

// Marca o desmarca. Devuelve true si encontró la tarea y la cambió.
// No necesita saber de qué lista es: el id ya la identifica sin ambigüedad.
function alternarTarea(idTarea) {
  const tarea = datos.tareas.find(x => x.id === idTarea);
  if (!tarea) return false;

  tarea.hecha = !tarea.hecha;

  encolar({ tipo: 'guardarTarea', id: idTarea });
  guardar();
  pintarLista();
  return true;
}

// Mover algo de una lista a la otra. Esta es la función que justifica haber
// usado un solo array: es una línea que cambia un campo. Con dos arrays
// separados habría que sacarlo de uno, meterlo en el otro y cuidar de no
// perderlo en el camino.
function moverALista(idTarea, lista) {
  if (lista !== LISTAS.pendientes && lista !== LISTAS.ideas) return false;

  const tarea = datos.tareas.find(x => x.id === idTarea);
  if (!tarea || tarea.lista === lista) return false;

  tarea.lista = lista;
  // Una idea que pasa a ser pendiente arranca sin marcar: acabas de decidir
  // hacerla, así que todavía está por hacer.
  tarea.hecha = false;

  // No cambia de sitio en el array, solo de columna: una sola fila que subir.
  // Ese es el pago de haber usado un array con una columna "lista" en vez de
  // dos arrays gemelos.
  encolar({ tipo: 'guardarTarea', id: idTarea });
  guardar();
  pintarLista();
  return true;
}

// Subir o bajar una tarea una posición dentro de SU lista.
// direccion: -1 sube, 1 baja. Devuelve true si se movió.
//
// Aquí está el detalle que hace esta función menos obvia de lo que parece.
// En pantalla ves una lista limpia de pendientes; en los datos, esos
// pendientes están salpicados dentro de un array que también tiene las ideas
// y las tareas ya hechas. Subir "una posición" en pantalla puede significar
// saltar tres sitios en el array. Por eso no se intercambian vecinos a lo
// bruto: primero se anota en qué sitios del array están las tareas que sí se
// ven, y se intercambian esos dos sitios.
//
// En SQL esto sería intercambiar el valor de una columna "orden" entre dos
// filas. Aquí el orden no es una columna: es la posición en el array. Cuando
// estas listas suban a Supabase habrá que darles su columna `orden`, porque
// una tabla de Postgres no tiene orden propio — es lo mismo que ya hace
// habitoAFila() con los hábitos.
//
// Las tareas ya hechas no se mueven: viven al final por definición
// (tareasOrdenadas las manda ahí), así que reordenarlas no cambiaría nada.
function moverTarea(idTarea, direccion) {
  const tarea = datos.tareas.find(x => x.id === idTarea);
  if (!tarea || tarea.hecha) return false;

  const sitios = [];
  datos.tareas.forEach((x, i) => {
    if (x.lista === tarea.lista && !x.hecha) sitios.push(i);
  });

  const cual = sitios.indexOf(datos.tareas.indexOf(tarea));
  const destino = cual + direccion;
  if (destino < 0 || destino >= sitios.length) return false;   // ya está en el extremo

  // Se intercambia el CONTENIDO de los dos sitios. Lo que haya en medio
  // (ideas, tareas hechas) ni se entera.
  const a = sitios[cual];
  const b = sitios[destino];
  [datos.tareas[a], datos.tareas[b]] = [datos.tareas[b], datos.tareas[a]];

  // Cambiaron de sitio exactamente dos, así que se suben exactamente dos.
  encolar({ tipo: 'guardarTarea', id: datos.tareas[a].id });
  encolar({ tipo: 'guardarTarea', id: datos.tareas[b].id });
  guardar();
  pintarLista();
  return true;
}

// Cambiar el texto y/o la nota de contexto de una tarea.
//
// La nota es el campo que hace útiles las Ideas: "app de propinas" no dice
// nada dentro de tres semanas; la nota guarda por qué te pareció buena. Es
// opcional a propósito — si no escribes nada, el campo ni siquiera existe en
// los datos. Un campo vacío guardado en todas las filas es basura que se
// arrastra para siempre.
//
// Pasar "undefined" en un parámetro significa "no toques eso". Por eso se usa
// ?? y no ||: con || un texto vacío se confundiría con "no lo mandaron", y
// borrar una nota dejaría de funcionar.
function editarTarea(idTarea, textoNuevo, notaNueva) {
  const tarea = datos.tareas.find(x => x.id === idTarea);
  if (!tarea) return false;

  const texto = (textoNuevo ?? tarea.texto ?? '').trim().slice(0, 120);
  if (!texto) return false;                  // sin título no hay tarea

  const nota = (notaNueva ?? tarea.nota ?? '').trim().slice(0, 500);

  // Si no cambió nada, no guardamos: escribir en disco por gusto es trabajo
  // que no hace falta, y hace más difícil saber qué cambió de verdad.
  if (tarea.texto === texto && (tarea.nota || '') === nota) return false;

  tarea.texto = texto;
  if (nota) tarea.nota = nota; else delete tarea.nota;

  encolar({ tipo: 'guardarTarea', id: idTarea });
  guardar();
  pintarLista();
  return true;
}

// Cambiar solo el texto pasa a ser un caso particular de lo anterior, igual
// que alternarHoy es un caso particular de alternarFecha. Una sola lógica de
// verdad, dos maneras cómodas de llamarla.
function renombrarTarea(idTarea, textoNuevo) {
  return editarTarea(idTarea, textoNuevo, undefined);
}

// Borrar no pide confirmación, a diferencia de borrar un hábito. La diferencia
// es lo que se pierde: un hábito se lleva años de historial; una tarea es una
// línea de texto que vuelves a escribir en tres segundos. Además la ✕ solo
// existe en modo edición, que ya es una barrera.
function borrarTarea(idTarea) {
  const donde = datos.tareas.findIndex(x => x.id === idTarea);
  if (donde === -1) return false;                    // ese id no existía

  datos.tareas.splice(donde, 1);

  encolar({ tipo: 'borrarTarea', id: idTarea });
  // Las que venían detrás se corrieron un sitio, así que su "orden" en la
  // nube quedó viejo. Se vuelven a subir; las de delante no se movieron.
  encolarTareasDesde(donde);

  guardar();
  pintarLista();
  return true;
}

// Barrer de una vez las hechas DE UNA LISTA. Devuelve cuántas se llevó.
// Que reciba la lista importa: limpiar tus pendientes no debe tocar tus ideas.
// En SQL: DELETE FROM tareas WHERE hecha = true AND lista = ?
function limpiarHechas(lista) {
  const seVan = datos.tareas.filter(tarea => tarea.hecha && tarea.lista === lista);
  if (seVan.length === 0) return 0;

  // Dónde estaba la primera que se va: desde ahí en adelante todas cambian de
  // sitio. Hay que anotarlo ANTES de borrar, porque después ya no está.
  const primera = datos.tareas.indexOf(seVan[0]);

  datos.tareas = datos.tareas.filter(tarea => !(tarea.hecha && tarea.lista === lista));

  seVan.forEach(tarea => encolar({ tipo: 'borrarTarea', id: tarea.id }));
  encolarTareasDesde(primera);

  guardar();
  pintarLista();
  return seVan.length;
}

// El orden en que se dibujan: primero lo que falta, al final lo hecho.
// Dentro de cada grupo se respeta el orden en que las escribiste.
//
// Se hace con dos filtros en vez de con .sort() a propósito. Con sort habría
// que confiar en que no reordena los empates entre sí, y además costaría más
// leerlo. Dos filtros y un concat dicen exactamente lo que pasa: "las que
// faltan, y detrás las hechas".
//
// Es una función pura: no toca nada, solo devuelve una lista nueva. Por eso se
// puede probar sin arrancar la app.
function tareasOrdenadas(lista) {
  const todas = tareasDe(lista);
  return todas.filter(tarea => !tarea.hecha).concat(todas.filter(tarea => tarea.hecha));
}

// Los números de UNA lista, para el contador y la barra de progreso. Aislado
// por lista a propósito: las ideas no deben sumar al contador de pendientes,
// porque una idea sin hacer no es una deuda.
function contarTareas(lista) {
  const todas = tareasDe(lista);
  const hechas = todas.filter(tarea => tarea.hecha).length;
  return { total: todas.length, hechas: hechas, faltan: todas.length - hechas };
}
/* ---------- fin D2 ---------- */

/* ---------- E. PINTAR LA PANTALLA ----------
   Regla de oro: los datos son la verdad. Cada vez que cambian,
   volvemos a dibujar todo desde cero. Es más simple y no se
   desincroniza nunca.                                           */

const lista = document.getElementById('lista');

// Cuál hábito se acaba de marcar, para darle la animación del círculo al
// dibujarlo. Vive fuera de pintar() porque quien lo pone es alternarFecha(),
// que ocurre antes. Se limpia sola después de usarla una vez: si se quedara
// puesta, la animación volvería a salir al cambiar de idioma o al sincronizar,
// que también repintan.
let habitoRecienMarcado = null;

/* Traduce todo lo que está escrito directamente en el HTML.

   En vez de ir elemento por elemento desde el código ("el botón Guardar dice
   esto, el título dice aquello"), se marca cada uno en el HTML con
   data-t="clave" y esta función los recorre de golpe. Agregar un texto nuevo
   traducible es agregarle el atributo, sin volver aquí.

   data-t   -> el texto que se ve
   data-ph  -> el texto guía de un campo (placeholder)
   data-aria-> el nombre que lee VoiceOver de un botón que solo tiene un símbolo */
function traducirEstaticos() {
  document.querySelectorAll('[data-t]').forEach(el => {
    el.textContent = t(el.dataset.t);
  });
  document.querySelectorAll('[data-ph]').forEach(el => {
    el.setAttribute('placeholder', t(el.dataset.ph));
  });
  document.querySelectorAll('[data-aria]').forEach(el => {
    el.setAttribute('aria-label', t(el.dataset.aria));
  });

  document.title = t('tituloApp');

  // Las letras de los días del calendario. Se rehacen aquí y no en el HTML
  // porque son siete y cambian con el idioma.
  const nombres = document.getElementById('calNombres');
  nombres.innerHTML = '';
  t('letrasDias').forEach(letra => {
    const span = document.createElement('span');
    span.textContent = letra;
    nombres.appendChild(span);
  });
}

function pintar() {
  traducirEstaticos();

  // Fecha de arriba
  document.getElementById('fecha').textContent =
    new Date().toLocaleDateString(localeFechas(), { weekday:'long', day:'numeric', month:'long' });

  // Saludo según la hora del día. El nombre ya no está escrito dentro del
  // código: sale de Ajustes. Si está vacío, el saludo queda solo ("Buenos
  // días") en vez de terminar en una coma huérfana.
  const hora = new Date().getHours();
  let saludo = t('saludoNoche');
  if (hora < 12) saludo = t('saludoManana');
  else if (hora < 19) saludo = t('saludoTarde');
  const nombre = (datos.prefs.nombre || '').trim();
  document.querySelector('.titulo').textContent = nombre ? `${saludo}, ${nombre}` : saludo;

  // El botón grande de abajo depende de la sección; en Hábitos siempre dice
  // lo mismo. Va aquí para que también se actualice al cambiar de idioma.
  if (vista === 'habitos') {
    document.getElementById('btnAgregar').textContent = t('nuevoHabito');
    document.getElementById('progresoEtiqueta').textContent = t('hoy');
  }

  // Caso: todavía no hay hábitos
  if (datos.habitos.length === 0) {
    lista.innerHTML = `
      <div class="vacio">
        <div class="vacio-emoji">🌱</div>
        <div>${t('vacioHabitos')}</div>
      </div>`;
    document.getElementById('cajaProgreso').style.visibility = 'hidden';
    return;
  }
  document.getElementById('cajaProgreso').style.visibility = 'visible';

  // Barra de progreso del día
  const hechosHoy = datos.habitos.filter(h => estaHecho(h.id, hoy())).length;
  document.getElementById('progresoTexto').textContent =
    `${hechosHoy} ${t('de')} ${datos.habitos.length}`;
  document.getElementById('barra').style.width = (hechosHoy / datos.habitos.length * 100) + '%';

  // Una tarjeta por hábito
  lista.innerHTML = '';
  datos.habitos.forEach((h, indice) => {
    const hecho = estaHecho(h.id, hoy());
    const racha = calcularRacha(h.id);
    const esPrimero = indice === 0;
    const esUltimo  = indice === datos.habitos.length - 1;

    // Los 7 puntitos: de hace 6 días hasta hoy
    let puntos = '';
    for (let i = 13; i >= 0; i--) {
      const lleno = estaHecho(h.id, haceNDias(i)) ? 'lleno' : '';
      puntos += `<div class="dia ${lleno}"></div>`;
    }

    const tarjeta = document.createElement('div');
    tarjeta.className = 'habito' + (hecho ? ' hecho' : '');
    tarjeta.innerHTML = `
      <div class="habito-emoji">${h.emoji}</div>
      <div class="habito-info">
        <div class="habito-nombre">${h.nombre}</div>
        <div class="semana">
          ${puntos}
          <span class="racha">${racha > 2 ? '🔥 ' + racha : ''}</span>
        </div>
      </div>
      <div class="check">✓</div>
      <div class="acciones">
        <button class="subir"  ${esPrimero ? 'disabled' : ''}>↑</button>
        <button class="bajar"  ${esUltimo  ? 'disabled' : ''}>↓</button>
        <button class="borrar">✕</button>
      </div>
    `;

    // Si este es el hábito que se acaba de marcar, su círculo nace con la
    // clase puesta y el navegador arranca la animación al insertarlo.
    if (h.id === habitoRecienMarcado) {
      tarjeta.querySelector('.check').classList.add('celebrar');
    }

    // Tocar la tarjeta = marcar/desmarcar
    tarjeta.querySelector('.check').onclick = () => alternarHoy(h.id);
    tarjeta.querySelector('.habito-info').onclick = () => {
      if (!document.body.classList.contains('editando')) alternarHoy(h.id);
    };
    tarjeta.querySelector('.borrar').onclick = () => borrarHabito(h.id);
    // El emoji hace dos cosas distintas según el modo: en uso normal abre
    // el calendario; en modo edición te deja cambiarlo. Es el mismo criterio
    // que el nombre, para no tener que aprender dos reglas.
    tarjeta.querySelector('.habito-emoji').onclick = () => {
      if (!document.body.classList.contains('editando')) {
        abrirCalendario(h.id);
        return;
      }
      const nuevo = prompt(`${t('promptEmoji')} "${h.nombre}":`, h.emoji);
      if (nuevo === null) return;                       // tocaste Cancelar
      if (!cambiarEmoji(h.id, nuevo) && primerEmoji(nuevo) === '') {
        alert(t('emojiInvalido'));
      }
    };

    // Reordenar (solo se ven en modo edición)
    tarjeta.querySelector('.subir').onclick = () => moverHabito(h.id, -1);

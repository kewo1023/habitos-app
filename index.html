/* ---------- E2. EL CONFETI DEL DÍA COMPLETO ----------
   Esto no se puede probar con pruebas.js: no hay pantalla que mirar. Lo que
   sí se prueba es la condición que lo dispara, diaCompleto(), que vive arriba
   en la sección C. Esa es la razón de haberlas separado — la parte que puede
   equivocarse es la decisión, no la animación.                              */

const capaConfeti = document.getElementById('confeti');

const PAPELITOS = 34;   // suficientes para que se vea, pocos para que no pese

// Los colores se leen del CSS en el momento de lanzar, no al abrir la app.
// Motivo: el tema pudo haber cambiado desde entonces, y unos papelitos
// pensados para fondo oscuro cayendo sobre fondo blanco se ven mal.
function coloresConfeti() {
  const css = getComputedStyle(document.documentElement);
  return ['--exito', '--acento', '--celebrar']
    .map(nombre => css.getPropertyValue(nombre).trim())
    .filter(Boolean);
}

// Un número al azar entre dos, para no repetir Math.random() por todas partes.
function entre(min, max) {
  return min + Math.random() * (max - min);
}

function celebrarDiaCompleto() {
  // Si el teléfono pide menos movimiento (Ajustes > Accesibilidad > Movimiento),
  // no se lanza nada. Se comprueba aquí y no solo en el CSS porque así ni
  // siquiera se crean los 34 elementos: es más barato no hacer el trabajo que
  // hacerlo y esconderlo.
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const colores = coloresConfeti();

  // Si quedara confeti de una celebración anterior a medias, se limpia. Puede
  // pasar si desmarcas y vuelves a marcar rápido.
  capaConfeti.innerHTML = '';

  for (let i = 0; i < PAPELITOS; i++) {
    const papel = document.createElement('div');
    papel.className = 'papelito';

    papel.style.left            = entre(0, 100) + 'vw';
    papel.style.top             = entre(-15, -5) + 'vh';   // arrancan fuera de la pantalla, arriba
    papel.style.background      = colores[i % colores.length];
    papel.style.borderRadius    = Math.random() < .35 ? '50%' : '2px';

    // Las tres variables que usa la animación 'caer'. El azar vive en
    // JavaScript y el movimiento en CSS: así el navegador anima en la tarjeta
    // gráfica en vez de que nosotros movamos cada papelito con un temporizador.
    papel.style.setProperty('--dx',   entre(-70, 70) + 'px');
    papel.style.setProperty('--giro', entre(-540, 540) + 'deg');
    papel.style.setProperty('--dur',  entre(1.6, 2.8) + 's');

    capaConfeti.appendChild(papel);
  }

  // Borrar los elementos cuando termina la animación. Sin esto se irían
  // acumulando 34 divs invisibles por cada día completado, para siempre.
  // 3000 ms cubre el papelito más lento (2.8s) con margen.
  setTimeout(() => { capaConfeti.innerHTML = ''; }, 3000);
}

/* ---------- F0. EMOJIS (lógica pura, se prueba) ----------
   Un emoji no es "un carácter". Para JavaScript, 👨‍👩‍👧 son cinco piezas
   pegadas con un carácter invisible, y 🇨🇴 son dos. Si cortaras el texto
   a lo bruto con texto[0] te quedaría media cosa y saldría un símbolo
   roto. Intl.Segmenter agrupa esas piezas en lo que un humano ve como
   un solo símbolo — es la herramienta correcta para este trabajo.       */

function primerEmoji(texto) {
  const limpio = (texto || '').trim();
  if (!limpio) return '';

  let simbolo;
  if (typeof Intl !== 'undefined' && Intl.Segmenter) {
    // granularity: 'grapheme' = "córtame por símbolos visibles"
    const trozos = new Intl.Segmenter('es', { granularity: 'grapheme' }).segment(limpio);
    simbolo = [...trozos][0].segment;
  } else {
    // Plan B para navegadores viejos. Array.from al menos no parte
    // los pares de piezas, aunque no junta las familias.
    simbolo = Array.from(limpio)[0];
  }

  // Y ahora: ¿esto que quedó es de verdad un emoji, o escribiste una letra?
  //   Extended_Pictographic -> los emojis normales (😀 🏃 💧)
  //   Regional_Indicator    -> las banderas (🇨🇴 son dos de estos)
  //   ⃣                -> el cuadrito de los teclados numéricos (1️⃣)
  const esEmoji = /\p{Extended_Pictographic}|\p{Regional_Indicator}|⃣/u;
  return esEmoji.test(simbolo) ? simbolo : '';
}
/* ---------- fin F0 ---------- */

/* ---------- F. LA VENTANA DE "NUEVO HÁBITO" ---------- */

/* ---------- H. COPIA DE SEGURIDAD ----------
   Exportar = convertir nuestros datos a un archivo .json y entregártelo.
   Importar = leer ese archivo y volver a meter los datos en la app.
   Un .json es solo texto con la misma forma que ves en la sección A.     */

function nombreArchivo() {
  return `habitos-${hoy()}.json`;   // ej: habitos-2026-08-02.json
}

async function exportar() {
  // JSON.stringify con "null, 2" al final = con saltos de línea y sangría,
  // para que el archivo se pueda leer con los ojos si haces falta.
  const texto = JSON.stringify(datos, null, 2);
  const archivo = new File([texto], nombreArchivo(), { type: 'application/json' });

  // En el iPhone lo natural es el menú Compartir: te deja guardarlo en
  // Archivos, mandártelo por correo, subirlo a iCloud...
  if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
    try {
      await navigator.share({ files: [archivo], title: t('tituloCompartir') });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;   // cancelaste el menú, todo bien
      // cualquier otro error: seguimos al plan B de abajo
    }
  }

  // Plan B (computador): una descarga normal
  const url = URL.createObjectURL(archivo);
  const enlace = document.createElement('a');
  enlace.href = url;
  enlace.download = nombreArchivo();
  enlace.click();
  URL.revokeObjectURL(url);
}

// Nunca confíes en un archivo de afuera. Revisamos que tenga la forma
// esperada antes de dejarlo entrar; si no, podríamos romper la app entera.
function esCopiaValida(obj) {
  if (!obj || typeof obj !== 'object') return false;
  if (!Array.isArray(obj.habitos)) return false;
  if (!obj.registros || typeof obj.registros !== 'object' || Array.isArray(obj.registros)) return false;

  // Cada hábito debe tener al menos id y nombre
  const habitosOk = obj.habitos.every(h =>
    h && typeof h.id === 'string' && typeof h.nombre === 'string');

  // Cada día del historial debe ser una lista de ids
  const registrosOk = Object.values(obj.registros).every(v => Array.isArray(v));

  // Las tareas son opcionales: una copia hecha antes de que existiera la
  // sección de Pendientes sigue siendo una copia válida. Pero si vienen,
  // tienen que tener la forma correcta.
  const tareasOk = !('tareas' in obj) || (
    Array.isArray(obj.tareas) &&
    obj.tareas.every(tarea => tarea && typeof tarea.id === 'string' && typeof tarea.texto === 'string')
  );

  return habitosOk && registrosOk && tareasOk;
}

// Devuelve true si se importó, false si no. Así quien la llama sabe qué pasó.
function importar(texto) {
  let copia;
  try {
    copia = JSON.parse(texto);
  } catch (e) {
    alert(t('copiaIlegible'));
    return false;
  }

  if (!esCopiaValida(copia)) {
    alert(t('copiaMalFormada'));
    return false;
  }

  const cuantosHabitos = copia.habitos.length;
  const cuantosDias = Object.keys(copia.registros).length;

  // %h y %d son huecos que se rellenan con los números. Se hace así y no
  // pegando trozos de frase ("La copia tiene " + n + " hábitos") porque el
  // orden de las palabras cambia entre idiomas y pegando trozos acabas con
  // frases que no se pueden traducir sin tocar el código.
  const aviso = t('confirmImportar1')
                  .replace('%h', cuantosHabitos)
                  .replace('%d', cuantosDias)
                + '\n\n' + t('confirmImportar2');
  if (!confirm(aviso)) return false;

  datos = {
    version: 1,
    habitos: copia.habitos,
    registros: copia.registros,
    // Si la copia es vieja y no trae tareas, entra con la lista vacía.
    tareas: Array.isArray(copia.tareas) ? copia.tareas : [],
    pendientes: Array.isArray(copia.pendientes) ? copia.pendientes : [],
    // Los ajustes NO se importan: son de este dispositivo, no de la copia.
    // Restaurar un respaldo hecho en el Mac no debería cambiarte el idioma
    // del teléfono. Se conservan los que ya tenías.
    prefs: { ...PREFS_POR_DEFECTO, ...(datos.prefs || {}) }
  };
  guardar();
  pintar();
  if (typeof pintarLista === 'function') pintarLista();

  // Restaurar una copia cambia todo de golpe, así que hay que volver a
  // subirlo entero. Si la nube no está cargada, esto simplemente no pasa.
  if (typeof subirTodo === 'function') subirTodo();

  return true;
}

/* ---------- L. EL CALENDARIO EN PANTALLA ----------
   La lógica de fechas ya quedó resuelta arriba (secciones B, C y D).
   Aquí solo traducimos esos números a cuadritos en la pantalla.
   Esa separación es a propósito: lo de arriba se puede probar con
   pruebas.js; esto de aquí hay que mirarlo con los ojos.             */

// Estas tres variables recuerdan "qué estoy viendo ahora mismo".
let calHabitoId = null;
let calAnio = 0;
let calMes = 0;

function abrirCalendario(idHabito) {
  calHabitoId = idHabito;
  const ahora = new Date();
  calAnio = ahora.getFullYear();
  calMes = ahora.getMonth() + 1;      // +1 porque adentro contamos 1-12
  pintarCalendario();
  document.getElementById('modalCal').classList.add('abierto');
}

function cerrarCalendario() {
  document.getElementById('modalCal').classList.remove('abierto');
  calHabitoId = null;
}

// paso vale +1 (mes siguiente) o -1 (mes anterior).
// El if se encarga del salto de año en diciembre y enero.
function moverMes(paso) {
  calMes += paso;
  if (calMes > 12) { calMes = 1;  calAnio++; }
  if (calMes < 1)  { calMes = 12; calAnio--; }
  pintarCalendario();
}

function pintarCalendario() {
  const h = datos.habitos.find(x => x.id === calHabitoId);
  if (!h) return;

  document.getElementById('calTitulo').textContent = `${h.emoji} ${h.nombre}`;
  document.getElementById('calMes').textContent =
    new Date(calAnio, calMes - 1, 1)
      .toLocaleDateString(localeFechas(), { month: 'long', year: 'numeric' });

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';   // borrón y cuenta nueva, igual que en pintar()

  // 1) Cuadros vacíos hasta llegar al día 1. Sin esto, el mes empezaría
  //    siempre en lunes y las columnas quedarían corridas.
  for (let i = 0; i < columnaInicio(calAnio, calMes); i++) {
    grid.appendChild(document.createElement('div'));
  }

  // 2) Un botón por cada día real del mes
  for (let d = 1; d <= diasDelMes(calAnio, calMes); d++) {
    const fecha = claveDe(calAnio, calMes, d);

    const celda = document.createElement('button');
    celda.className = 'cal-dia';
    if (estaHecho(calHabitoId, fecha)) celda.classList.add('hecho');
    if (fecha === hoy())               celda.classList.add('hoy');
    if (esFutura(fecha))               celda.classList.add('futuro');
    celda.textContent = d;

    // Tocar un día lo corrige. alternarFecha devuelve false si es futuro,
    // así que ahí no repintamos nada: el toque simplemente no hace efecto.
    celda.onclick = () => {
      if (alternarFecha(calHabitoId, fecha)) pintarCalendario();
    };

    grid.appendChild(celda);
  }

  // 3) El resumen de abajo
  const hechos = contarMes(calHabitoId, calAnio, calMes);
  const total = diasDelMes(calAnio, calMes);
  document.getElementById('calResumen').textContent =
    `${hechos} ${t('de')} ${total} ${t('diasCorrige')}`;

  // 4) Las estadísticas
  pintarStats();
}

/* --- Las estadísticas del hábito abierto ---
   Toda la definición vive en esta lista: etiqueta, cómo se calcula y qué
   explica. Agregar una quinta estadística es agregar un objeto aquí; ni el
   dibujado ni la ayuda hay que tocarlos. Los datos mandan sobre el código. */
// Fíjate en el cambio de la v15: antes aquí estaban las frases; ahora están
// las CLAVES de las frases, y el texto sale de TEXTOS al dibujar. Tuvo que ser
// así porque esta lista se crea una sola vez al abrir la app, y el idioma se
// puede cambiar después: si guardara el texto, se quedaría congelado en el
// idioma con el que arrancaste.
const ESTADISTICAS = [
  { etiqueta: 'eRacha',      ayuda: 'aRacha',      calcular: id => calcularRacha(id) },
  { etiqueta: 'eMejorRacha', ayuda: 'aMejorRacha', calcular: id => mejorRacha(id) },
  { etiqueta: 'eUltimos30',  ayuda: 'aUltimos30',  calcular: id => porcentajeUltimos(id, 30) + '%' },
  { etiqueta: 'eTotal',      ayuda: 'aTotal',      calcular: id => totalDias(id) }
];

function pintarStats() {
  const caja = document.getElementById('calStats');
  caja.innerHTML = ESTADISTICAS.map((e, i) => `
    <button class="stat" data-i="${i}">
      <div class="stat-numero">${e.calcular(calHabitoId)}</div>
      <div class="stat-etiqueta">${t(e.etiqueta)}</div>
    </button>`).join('');

  // Un manejador por recuadro: muestra su explicación, y si ya estaba
  // mostrándose, la cierra. Así el mismo toque sirve para abrir y cerrar.
  caja.querySelectorAll('.stat').forEach(boton => {
    boton.onclick = () => {
      const yaEstaba = boton.classList.contains('activa');
      caja.querySelectorAll('.stat').forEach(b => b.classList.remove('activa'));

      if (yaEstaba) {
        mostrarAyuda(null);
      } else {
        boton.classList.add('activa');
        mostrarAyuda(t(ESTADISTICAS[boton.dataset.i].ayuda));
      }
    };
  });

  mostrarAyuda(null);   // al abrir el calendario siempre parte del texto guía
}

function mostrarAyuda(texto) {
  document.getElementById('calAyuda').textContent = texto || t('ayudaPorDefecto');
}

/* ---------- M1. TRADUCIR ERRORES (lógica pura, se prueba) ----------
   Supabase responde en inglés y en jerga. Esta función traduce los
   casos que de verdad te pueden pasar. Está aparte del resto porque
   no toca ni la pantalla ni la red: así se puede probar. */
function mensajeDeError(error) {
  if (!error) return '';
  const texto = (error.message || '').toLowerCase();

  if (texto.includes('invalid login credentials'))
    return t('errCredenciales');
  if (texto.includes('email not confirmed'))
    return t('errSinConfirmar');
  if (texto.includes('failed to fetch') || texto.includes('network'))
    return t('errSinConexion');
  if (texto.includes('rate limit') || texto.includes('too many'))
    return t('errDemasiados');

  return t('errGenerico') + (error.message || t('errDesconocido'));
}

async function entrar(correo, contrasena) {

  const { error } = await nube.auth.signInWithPassword({
    email: correo,

async function salir() {

async function iniciarNube(createClient) {

  // Un solo sitio que reacciona a cualquier cambio de sesión: entrar,
  // salir, o la renovación automática del token cada hora.
  nube.auth.onAuthStateChange((evento, nuevaSesion) => {
    const antesHabiaSesion = Boolean(sesion);
    sesion = nuevaSesion;
    pintarSesion();

    // Acabas de entrar: es el momento de sincronizar
    if (!antesHabiaSesion && sesion) primeraSincronizacion();
  });

  if (sesion) primeraSincronizacion();
  pintarSesion();
}

// La primera vez que entras en un dispositivo hay que empujar hacia arriba
// lo que ya tenías guardado aquí — tu historial de antes de la Fase 3, que
// la nube todavía no conoce. Después de esa vez, la cola normal se encarga.
function primeraSincronizacion() {
  if (!datos.subidaHecha) {
    subirTodo();               // en un teléfono nuevo esto no encola nada
    datos.subidaHecha   = true;
    datos.tareasSubidas = true;   // subirTodo() ya las encoló
    guardar();

  } else if (!datos.tareasSubidas) {
    // Este caso es el importante y es fácil de no ver. Las tareas llegaron a
    // la nube en la v16, pero tú ya habías entrado antes: tienes subidaHecha
    // en true, así que la rama de arriba no se ejecuta nunca más. Sin esta
    // segunda bandera tus pendientes e ideas no se subirían jamás, y el
    // primer bajarTodo() te los borraría a todos reemplazándolos por la tabla
    // vacía de la nube.
    //
    // La regla general: cada vez que el modelo crece, hay que preguntarse qué
    // pasa con quien ya venía usando la app. Los datos nuevos casi nunca son
    // el problema; los viejos, casi siempre.
    encolarTareasDesde(0);
    datos.tareasSubidas = true;
    guardar();
  }
  sincronizar();
}

// Tres momentos en que vale la pena mirar la nube, además de al cambiar algo:
window.addEventListener('online', sincronizar);          // volvió la señal
document.addEventListener('visibilitychange', () => {    // volviste a la app
  if (document.visibilityState === 'visible') sincronizar();
});

/* ---------- M4. EL PANEL DE CUENTA ---------- */

function pintarSesion(mensaje, tipo) {
  const fuera  = document.getElementById('sesionFuera');
  const dentro = document.getElementById('sesionDentro');
  const estado = document.getElementById('sesionEstado');

  const conectado = Boolean(sesion);
  fuera.hidden  = conectado;
  dentro.hidden = !conectado;

  estado.className = 'sesion-estado' + (tipo ? ' ' + tipo : '');

  if (mensaje) {
    estado.textContent = mensaje;
  } else if (conectado) {
    // El orden de estos casos es el orden en que hay que sospechar. Antes
    // solo había dos ramas y la del medio se comía a la de abajo: con
    // cambios en la cola siempre decía "esperando señal", aunque la señal
    // estuviera perfecta y el problema fuera que la nube estaba rechazando
    // algo. Un mensaje que culpa al motivo equivocado es peor que no tener
    // mensaje: te manda a mirar donde no es.
    let detalle;
    if (sincronizando) {
      detalle = t('sincronizando');
    } else if (navigator.onLine === false) {
      detalle = textoPendientes(datos.pendientes.length) + ' ' + t('sinSenal');
    } else if (ultimoErrorNube) {
      detalle = textoPendientes(datos.pendientes.length) + ' ' +
                t('errorSubiendo')
                  .replace('%t', ultimoErrorNube.tipo)
                  .replace('%m', ultimoErrorNube.mensaje);
    } else {
      detalle = textoPendientes(datos.pendientes.length);
    }

    estado.textContent = `${sesion.user.email} — ${detalle}`;
    if (ultimoErrorNube && !sincronizando) estado.className += ' error';
    else if (!sincronizando && datos.pendientes.length === 0) estado.className += ' bien';
  } else if (nube) {
    estado.textContent = t('invitaEntrar');
  } else {
    estado.textContent = t('sinNube');
  }
}

// Ahora el botón "Entrar" vive dentro de un <form>, así que en vez de
// escuchar su clic escuchamos el "submit" del formulario. Es lo mismo, pero
// además cubre el caso de darle a "Ir" en el teclado del teléfono.
// El preventDefault es obligatorio: sin él, el navegador intentaría enviar
// el formulario a un servidor y recargaría la página.
document.getElementById('formEntrar').onsubmit = async (ev) => {
  ev.preventDefault();
  const correo = document.getElementById('correo').value.trim();
  const clave  = document.getElementById('clave').value;

  if (!correo || !clave) {
    pintarSesion(t('faltanDatos'), 'error');
    return;
  }

  const boton = document.getElementById('btnEntrar');
  boton.disabled = true;                       // que no lo toques dos veces
  pintarSesion(t('entrando'));

  const error = await entrar(correo, clave);
  boton.disabled = false;

  if (error) {
    pintarSesion(mensajeDeError(error), 'error');
  } else {
    document.getElementById('clave').value = '';   // no dejarla en pantalla
    pintarSesion(t('entraste'), 'bien');
  }
};

document.getElementById('btnSalir').onclick = async () => {
  await salir();
  pintarSesion(t('sesionCerrada'));
};

// Estado inicial, mientras la librería baja (o si nunca baja)
pintarSesion();

/* ---------- M5. TRADUCIR ENTRE LA APP Y LA BASE (puro, se prueba) ----------
   La app y Postgres guardan lo mismo con formas distintas. Estas tres
   funciones son los traductores. No tocan la red ni la pantalla: solo
   reciben datos y devuelven datos, así que se pueden probar. */

// De un hábito de la app a una fila de la tabla "habitos".
// El "orden" no está en el objeto: es su posición en la lista. Un array
// tiene orden por sí mismo; una tabla no, hay que escribirlo en una columna.
function habitoAFila(habito, indice, usuarioId) {
  return {
    id:      habito.id,
    usuario: usuarioId,
    nombre:  habito.nombre,
    emoji:   habito.emoji,
    creado:  habito.creado || hoy(),
    orden:   indice
  };
}

// De las filas de la tabla a la lista que usa la app.
// Nos quedamos solo con las columnas que la app necesita.
function filasAHabitos(filas) {
  return (filas || []).map(f => ({
    id: f.id, nombre: f.nombre, emoji: f.emoji, creado: f.creado
  }));
}

// De las filas de "registros" al objeto { fecha: [ids] }.
// Aquí se ve el cambio de forma más grande: en la base hay UNA FILA POR
// MARCA, y la app quiere las marcas agrupadas por día. Es lo mismo que
// haría un GROUP BY fecha en SQL.
function filasARegistros(filas) {
  const registros = {};
  (filas || []).forEach(f => {
    if (!registros[f.fecha]) registros[f.fecha] = [];
    if (!registros[f.fecha].includes(f.habito_id)) registros[f.fecha].push(f.habito_id);
  });
  return registros;
}

// De una tarea de la app a una fila de la tabla "tareas".
//
// Dos detalles que no son cosméticos:
//   - la nota vacía sube como null, no como ''. En la app un campo vacío ni
//     existe; en la base, null significa lo mismo. Guardar '' sería inventarse
//     un tercer estado ("existe pero está vacía") que no significa nada.
//   - hecha va con Boolean() porque Postgres es estricto con los tipos: un
//     undefined llegando a una columna "boolean not null" es un error, no un
//     false. JavaScript perdona esas cosas; SQL no.
function tareaAFila(tarea, indice, usuarioId) {
  return {
    id:      tarea.id,
    usuario: usuarioId,
    texto:   tarea.texto,
    nota:    tarea.nota || null,
    hecha:   Boolean(tarea.hecha),
    lista:   tarea.lista === LISTAS.ideas ? LISTAS.ideas : LISTAS.pendientes,
    creada:  tarea.creada || hoy(),
    orden:   indice
  };
}

// Y de vuelta. Las filas llegan ordenadas por la columna "orden" (eso lo pide
// la consulta), y aquí se vuelven a convertir en el array que usa la app.
// La nota se omite si viene vacía, para que los datos locales queden
// exactamente como los deja editarTarea(): sin campos vacíos de adorno.
function filasATareas(filas) {
  return (filas || []).map(f => {
    const tarea = {
      id: f.id, texto: f.texto, hecha: Boolean(f.hecha),
      creada: f.creada, lista: f.lista === LISTAS.ideas ? LISTAS.ideas : LISTAS.pendientes
    };
    if (f.nota) tarea.nota = f.nota;
    return tarea;
  });
}

// Cuenta cuántos cambios distintos hay esperando, para el mensaje del panel.
function textoPendientes(cuantos) {
  if (cuantos === 0) return t('todoSincronizado');
  if (cuantos === 1) return t('unCambioEsperando');
  return t('cambiosEsperando').replace('%n', cuantos);
}
/* ---------- fin M5 ---------- */

/* ---------- M6. SUBIR Y BAJAR ---------- */

// Nota: `ultimoErrorNube` se declara arriba, junto a `nube` y `sesion`.
//
// Existe por un problema real: la cola se atascó con 14 cambios y el panel
// decía "esperando señal" aunque había señal de sobra. El código miraba si
// hubo error (`return !error`) y tiraba el motivo a la basura, así que no
// había forma de saber qué pasaba sin abrir la consola del navegador.
//
// La regla que sale de ahí: **una cola que falla en silencio no se puede
// arreglar**. Si algo se reintenta solo, tiene que poder contar por qué no
// funcionó la última vez.

// Envía UN pendiente. Devuelve true si se pudo, false si no.
// Devolver false no es un fracaso definitivo: significa "todavía no",
// y el pendiente se queda en la cola para el próximo intento.
async function enviarPendiente(p) {
  const usuarioId = sesion.user.id;

  // Un solo sitio que decide qué devolver y que además deja constancia.
  // Antes esto era un `return !error` repetido cinco veces; ahora los cinco
  // pasan por aquí, así que no hay manera de olvidarse de anotar el motivo
  // en uno de ellos.
  const resultado = (error) => {
    if (error) {
      ultimoErrorNube = { tipo: p.tipo, mensaje: error.message || String(error) };
      console.error('No se pudo subir', p, error);
      return false;
    }
    ultimoErrorNube = null;
    return true;
  };

  if (p.tipo === 'guardarHabito') {
    const i = datos.habitos.findIndex(h => h.id === p.id);
    if (i === -1) return true;   // lo borraste después; ya no hay nada que subir

    const { error } = await nube.from('habitos')
      .upsert(habitoAFila(datos.habitos[i], i, usuarioId));
    return resultado(error);
  }

  if (p.tipo === 'borrarHabito') {
    const { error } = await nube.from('habitos').delete().eq('id', p.id);
    return resultado(error);
  }

  if (p.tipo === 'marcar') {
    // upsert = "insertar, y si ya existe no te quejes". Como la llave
    // primaria es (habito_id, fecha), marcar dos veces el mismo día no
    // duplica nada: la base de datos no lo permite.
    const { error } = await nube.from('registros')
      .upsert({ usuario: usuarioId, habito_id: p.id, fecha: p.fecha });
    return resultado(error);
  }

  if (p.tipo === 'desmarcar') {
    const { error } = await nube.from('registros').delete()
      .eq('habito_id', p.id).eq('fecha', p.fecha);
    return resultado(error);
  }

  if (p.tipo === 'guardarTarea') {
    // Se busca la posición ahora, al enviar, y no cuando se encoló. Si
    // mientras tanto la tarea se movió, sube con su sitio de verdad.
    const i = datos.tareas.findIndex(x => x.id === p.id);
    if (i === -1) return true;   // la borraste después; ya no hay nada que subir

    const { error } = await nube.from('tareas')
      .upsert(tareaAFila(datos.tareas[i], i, usuarioId));
    return resultado(error);
  }

  if (p.tipo === 'borrarTarea') {
    const { error } = await nube.from('tareas').delete().eq('id', p.id);
    return resultado(error);
  }

  return true;   // un tipo desconocido no debe atascar la cola para siempre
}

// Baja el estado completo de la nube y reemplaza el local.
// Solo se llama cuando la cola quedó vacía, o sea cuando la nube ya tiene
// todo lo tuyo. Así "reemplazar" nunca pierde nada.
async function bajarTodo() {
  const { data: filasHabitos, error: e1 } =
    await nube.from('habitos').select('*').order('orden');
  if (e1) return false;

  const { data: filasRegistros, error: e2 } =
    await nube.from('registros').select('*');
  if (e2) return false;

  // El .order('orden') no es un adorno: en SQL, si no pides un orden, el
  // motor te devuelve las filas como le convenga. Sin esta línea tus
  // pendientes llegarían barajados.
  const { data: filasTareas, error: e3 } =
    await nube.from('tareas').select('*').order('orden');
  if (e3) return false;

  // Red de seguridad. Si la nube llega vacía pero aquí sí hay hábitos,
  // guardamos una copia aparte antes de reemplazar. No debería pasar nunca
  // — solo bajamos con la cola vacía — pero perder el historial es justo
  // lo que la Fase 3 vino a evitar, así que vale el par de líneas.
  if (filasHabitos.length === 0 && datos.habitos.length > 0) {
    localStorage.setItem(CLAVE + '-respaldo', JSON.stringify(datos));
    console.warn('La nube vino vacía. Copia de emergencia guardada.');
  }

  datos.habitos   = filasAHabitos(filasHabitos);
  datos.registros = filasARegistros(filasRegistros);
  // Desde la v16 las tareas también bajan. Se puede reemplazar sin miedo por
  // la misma razón que los hábitos: solo se llega aquí con la cola vacía, o
  // sea cuando la nube ya tiene todo lo tuyo.
  datos.tareas    = filasATareas(filasTareas);

  guardar();
  pintar();
  pintarLista();   // por si estabas parado en Pendientes o en Ideas cuando bajó
  return true;
}

// Encola TODO lo que hay en el teléfono. Se usa dos veces: la primera vez
// que entras (para que tu historial de antes de la Fase 3 llegue a la nube)
// y al restaurar una copia de seguridad.
function subirTodo() {
  datos.habitos.forEach(h => encolar({ tipo: 'guardarHabito', id: h.id }));
  for (const fecha in datos.registros) {
    datos.registros[fecha].forEach(id => encolar({ tipo: 'marcar', id: id, fecha: fecha }));
  }
  encolarTareasDesde(0);   // y las tareas enteras, con su orden
}

/* ---------- M7. EL CICLO DE SINCRONIZACIÓN ---------- */

let sincronizando = false;   // para que no corran dos a la vez
let reloj = null;            // el temporizador que agrupa cambios seguidos

// No sincronizamos en cada toque. Si marcas cuatro hábitos seguidos,
// esperamos un segundo desde el último y mandamos todo junto.
function pedirSincronizar() {
  clearTimeout(reloj);
  reloj = setTimeout(sincronizar, 1000);
}

async function sincronizar() {
  if (!nube || !sesion || sincronizando) return;
  if (navigator.onLine === false) { pintarSesion(); return; }

  sincronizando = true;
  pintarSesion();

  try {
    // 1) Primero SUBIR, en orden y de a uno. El orden importa: crear un
    //    hábito tiene que llegar antes que marcarlo.
    while (datos.pendientes.length > 0) {
      const pudo = await enviarPendiente(datos.pendientes[0]);

      // Si uno falla, paramos. No seguimos con los de atrás, porque
      // podrían depender de este. Se reintenta en la próxima ronda.
      if (!pudo) return;

      datos.pendientes.shift();
      guardar();
    }

    // 2) Y solo con la cola vacía, BAJAR. Este orden es la regla de oro:
    //    si bajáramos con cambios sin subir, la nube pisaría lo tuyo.
    await bajarTodo();

  } finally {
    sincronizando = false;
    pintarSesion();
  }
}

/* ---------- N. PENDIENTES E IDEAS EN PANTALLA ----------
   La lógica ya quedó resuelta arriba, en D2. Aquí solo traducimos esos datos
   a tarjetas y manejamos el cambio entre secciones. Misma separación que con
   el calendario (lógica en B/C/D, dibujado en L): lo de arriba se prueba con
   node, lo de aquí se mira con los ojos.                                   */

// Dónde estás parado ahora mismo: 'habitos', 'pendientes' o 'ideas'.
// Es la única variable que decide qué se ve; todo lo demás se deduce de ella.
let vista = 'habitos';

// Las dos listas comparten pantalla y solo cambian las palabras. Tenerlas aquí
// en una tabla, en vez de repartidas en ifs por todo el código, significa que
// agregar una tercera lista mañana es agregar un objeto a esta tabla.
//
// Desde la v15 esta tabla guarda CLAVES, no frases: las frases viven todas
// juntas en A0. El emoji sí se queda aquí, porque un emoji no se traduce.
const TEXTOS_LISTA = {
  pendientes: {
    etiqueta: 'pendientes', placeholder: 'phPendiente',
    boton: 'nuevoPendiente', vacioEmoji: '☑️', vacioTexto: 'vacioPendientes'
  },
  ideas: {
    etiqueta: 'ideas', placeholder: 'phIdea',
    boton: 'nuevaIdea', vacioEmoji: '💡', vacioTexto: 'vacioIdeas'
  }
};

const listaTareas  = document.getElementById('listaTareas');
const tareasCuerpo = document.getElementById('tareasCuerpo');
const campoTarea   = document.getElementById('tareaNueva');

// Al marcar algo, la tarjeta se va al final de la lista. Guardamos cuál fue
// para darle la animación de "aterrizaje" y que el salto no se sienta un error.
// Se limpia sola después de dibujarla una vez.
let tareaRecienMovida = null;

function cambiarVista(nueva) {
  vista = nueva;
  const enHabitos = vista === 'habitos';

  // Mostrar una lista y esconder la otra
  lista.hidden       = !enHabitos;
  listaTareas.hidden = enHabitos;

  // La clase en el body deja que el CSS reaccione sin más JavaScript
  // (por ejemplo, esconder los paneles de copia y cuenta).
  document.body.classList.toggle('vista-tareas', !enHabitos);

  // Las pestañas se iluminan según dónde estés
  document.getElementById('pestanaHabitos').classList.toggle('activa', enHabitos);
  document.getElementById('pestanaTareas').classList.toggle('activa', vista === 'pendientes');
  document.getElementById('pestanaIdeas').classList.toggle('activa', vista === 'ideas');

  // Salir del modo edición al cambiar de sección: si te quedaras dentro,
  // llegarías a la otra lista con las ✕ puestas sin haberlo pedido.
  document.body.classList.remove('editando');
  document.getElementById('btnEditar').textContent = t('editar');

  if (enHabitos) {
    pintar();   // pintar() ya pone el botón grande y la etiqueta "Hoy"
    return;
  }

  // Las palabras de la lista a la que llegaste. Ojo con el nombre: se llama
  // "palabras" y no "t" porque t() es ahora la función que traduce, y una
  // variable con el mismo nombre la taparía dentro de esta función.
  const palabras = TEXTOS_LISTA[vista];
  document.getElementById('btnAgregar').textContent = t(palabras.boton);
  document.getElementById('progresoEtiqueta').textContent = t(palabras.etiqueta);
  campoTarea.placeholder = t(palabras.placeholder);
  campoTarea.value = '';          // lo que ibas a escribir era para la otra lista

  pintarLista();
}

// Dibuja la lista en la que estés parado. Si estás en Hábitos no dibuja nada,
// pero sí actualiza el contador de la pestaña: por eso puede llamarse siempre.
function pintarLista() {
  // El contador de la pestaña cuenta SOLO pendientes sin hacer. Las ideas no
  // suman: una idea sin hacer no es una deuda, y verla como número la
  // convertiría en una.
  const faltanPendientes = contarTareas('pendientes').faltan;
  document.getElementById('contadorTareas').textContent =
    faltanPendientes > 0 ? faltanPendientes : '';

  if (vista === 'habitos') return;

  const cuenta = contarTareas(vista);
  const cajaProgreso = document.getElementById('cajaProgreso');

  // En Ideas se esconde la barra de progreso entera. No es un descuido: medir
  // cuántas ideas "llevas hechas" convertiría la lista en otra cosa que te
  // reclama. En Pendientes sí tiene sentido, ahí sí es una deuda que baja.
  if (vista === 'ideas') {
    cajaProgreso.style.visibility = 'hidden';
  } else {
    cajaProgreso.style.visibility = cuenta.total ? 'visible' : 'hidden';
    document.getElementById('progresoTexto').textContent =
      `${cuenta.hechas} ${t('de')} ${cuenta.total}`;
    document.getElementById('barra').style.width =
      (cuenta.total ? cuenta.hechas / cuenta.total * 100 : 0) + '%';
  }

  tareasCuerpo.innerHTML = '';

  if (cuenta.total === 0) {
    const palabras = TEXTOS_LISTA[vista];
    tareasCuerpo.innerHTML = `
      <div class="vacio">
        <div class="vacio-emoji">${palabras.vacioEmoji}</div>
        <div>${t(palabras.vacioTexto)}</div>
      </div>`;
    return;
  }

  // tareasOrdenadas() ya devuelve las que faltan primero y las hechas al final.
  const enIdeas = vista === 'ideas';

  // Las que todavía están por hacer, en el orden en que se ven. Se calcula una
  // sola vez y no dentro del bucle: buscar la posición de cada tarjeta
  // recorriendo el array entero, para cada tarjeta, es hacer el mismo trabajo
  // muchas veces. Con diez pendientes da igual; es la costumbre lo que importa.
  const porHacer = tareasDe(vista).filter(x => !x.hecha);

  tareasOrdenadas(vista).forEach(item => {
    const tarjeta = document.createElement('div');
    tarjeta.className = 'tarea' + (item.hecha ? ' hecha' : '')
                      + (enIdeas ? ' idea' : '')
                      + (item.id === tareaRecienMovida ? ' recien-movida' : '');

    // La flecha solo aparece en Ideas y solo si la idea sigue viva: mover a
    // pendientes algo que ya diste por hecho no tiene sentido.
    const botonMover = (enIdeas && !item.hecha)
      ? `<button class="mover" title="${t('aPendientesTitulo')}">→</button>` : '';

    // Posición entre las que faltan, para saber si sus flechas deben estar
    // apagadas. Una tarea ya hecha no tiene posición aquí (-1) y las lleva
    // apagadas las dos: vive al final de la lista por definición.
    const puesto  = porHacer.indexOf(item);
    const arriba  = puesto <= 0;
    const abajo   = puesto === -1 || puesto === porHacer.length - 1;

    tarjeta.innerHTML = `
      <div class="check">✓</div>
      <div class="tarea-info">
        <div class="tarea-texto"></div>
      </div>
      ${botonMover}
      <div class="acciones">
        <button class="subir"  ${arriba ? 'disabled' : ''}>↑</button>
        <button class="bajar"  ${abajo  ? 'disabled' : ''}>↓</button>
        <button class="borrar">✕</button>
      </div>
    `;

    // El texto se pone con textContent y no dentro del innerHTML de arriba.
    // Motivo: innerHTML interpreta lo que le des como HTML, así que una idea
    // escrita como "app de <algo>" se rompería. textContent lo trata como texto
    // y punto. Es la costumbre correcta con cualquier texto que venga de fuera
    // del código.
    tarjeta.querySelector('.tarea-texto').textContent = item.texto;

    // Si la idea tiene contexto escrito, se asoma debajo del título. Así la
    // reconoces sin abrirla, que es justo el problema que la nota vino a
    // resolver. El CSS la corta a dos líneas.
    if (enIdeas && item.nota) {
      const nota = document.createElement('div');
      nota.className = 'tarea-nota';
      nota.textContent = item.nota;
      tarjeta.querySelector('.tarea-info').appendChild(nota);
    }

    const marcar = () => {
      tareaRecienMovida = item.hecha ? null : item.id;   // solo al completarla
      alternarTarea(item.id);
    };

    // El círculo es el ÚNICO sitio que marca. Vale para las dos listas.
    tarjeta.querySelector('.check').onclick = marcar;

    tarjeta.querySelector('.tarea-info').onclick = () => {
      // Aquí las dos listas se separan a propósito:
      //   En IDEAS, tocar abre su ficha. El gesto que más haces con una idea
      //   es leerla y recordar de qué iba, no tacharla.
      //   En PENDIENTES, tocar marca. Ese sí es el gesto de cada día, y
      //   obligarte a apuntarle al círculo de 32px lo haría más lento.
      if (enIdeas) { abrirIdea(item.id); return; }

      if (!document.body.classList.contains('editando')) { marcar(); return; }
      const nuevo = prompt(t('promptPendiente'), item.texto);
      if (nuevo !== null) renombrarTarea(item.id, nuevo);
    };

    tarjeta.querySelector('.borrar').onclick = () => borrarTarea(item.id);

    // Reordenar. Mismo gesto que en Hábitos a propósito: flechas en modo
    // edición, y los botones de los extremos apagados en vez de escondidos
    // para que los demás no cambien de sitio bajo el dedo.
    tarjeta.querySelector('.subir').onclick = () => moverTarea(item.id, -1);
    tarjeta.querySelector('.bajar').onclick = () => moverTarea(item.id, 1);

    if (botonMover) {
      tarjeta.querySelector('.mover').onclick = (ev) => {
        // stopPropagation evita que el clic siga viajando hasta la tarjeta,
        // que abriría la ficha justo después de moverla.
        ev.stopPropagation();
        moverALista(item.id, 'pendientes');
        // Se queda en Ideas a propósito: si la app saltara sola a Pendientes,
        // perderías el hilo de lo que estabas revisando.
      };
    }

    tareasCuerpo.appendChild(tarjeta);
  });

  // Ya la dibujamos con su animación; se limpia para que no vuelva a animarse
  // en el siguiente repintado.
  tareaRecienMovida = null;

  // El botón de limpiar solo tiene sentido si hay algo que limpiar.
  if (cuenta.hechas > 0) {
    const listaActual = vista;   // se guarda porque el clic ocurre después
    const btn = document.createElement('button');
    btn.className = 'limpiar-hechas';
    btn.textContent = `${t('limpiarHechas')} ${cuenta.hechas} ${t('hechas')}`;
    btn.onclick = () => {
      if (confirm(t('confirmLimpiar'))) {
        limpiarHechas(listaActual);
      }
    };
    tareasCuerpo.appendChild(btn);
  }
}

/* --- Conectar los botones de esta sección --- */

document.getElementById('pestanaHabitos').onclick = () => cambiarVista('habitos');
document.getElementById('pestanaTareas').onclick  = () => cambiarVista('pendientes');
document.getElementById('pestanaIdeas').onclick   = () => cambiarVista('ideas');

function guardarTareaEscrita() {
  // Lo que escribas entra en la lista que estés viendo. Esa es toda la
  // diferencia entre anotar un pendiente y anotar una idea.
  if (agregarTarea(campoTarea.value, vista)) campoTarea.value = '';
  // El foco se queda en el campo: lo normal es anotar dos o tres cosas
  // seguidas, no una sola.
  campoTarea.focus();
}

// El campo y el botón "+" viven dentro de un <form>, así que basta con
// escuchar el "submit": lo disparan tanto el botón como la tecla Enter.
// preventDefault evita que el navegador recargue la página intentando mandar
// el formulario a un servidor que no existe.
document.getElementById('formTarea').onsubmit = (ev) => {
  ev.preventDefault();
  guardarTareaEscrita();
};

/* --- La ficha de una idea --- */

// Igual que el calendario guarda "qué hábito estoy viendo", esta variable
// guarda "qué idea tengo abierta". Sin ella, al tocar Guardar no sabríamos
// sobre cuál escribir.
let ideaAbierta = null;

const modalIdea = document.getElementById('modalIdea');

function abrirIdea(idTarea) {
  const idea = datos.tareas.find(x => x.id === idTarea);
  if (!idea) return;

  ideaAbierta = idTarea;
  document.getElementById('ideaTexto').value = idea.texto;
  document.getElementById('ideaNota').value  = idea.nota || '';

  // Una idea ya dada por hecha no se manda a Pendientes. Se deshabilita en
  // vez de esconderse, para que los botones no cambien de sitio bajo el dedo
  // — el mismo criterio que las flechas de reordenar hábitos.
  document.getElementById('ideaMover').disabled = idea.hecha;

  modalIdea.classList.add('abierto');
}

function cerrarIdea() {
  modalIdea.classList.remove('abierto');
  ideaAbierta = null;
}

document.getElementById('ideaGuardar').onclick = () => {
  editarTarea(ideaAbierta,
              document.getElementById('ideaTexto').value,
              document.getElementById('ideaNota').value);
  cerrarIdea();
};

document.getElementById('ideaMover').onclick = () => {
  // Se guarda antes de mover: si escribiste algo y tocaste "A Pendientes"
  // sin guardar, sería raro perderlo.
  editarTarea(ideaAbierta,
              document.getElementById('ideaTexto').value,
              document.getElementById('ideaNota').value);
  moverALista(ideaAbierta, 'pendientes');
  cerrarIdea();
};

document.getElementById('ideaBorrar').onclick = () => {
  // Aquí sí se pregunta, a diferencia de la ✕ de la lista. La razón es lo que
  // se pierde: una idea con contexto escrito ya no es una línea de texto que
  // reescribes en tres segundos.
  const idea = datos.tareas.find(x => x.id === ideaAbierta);
  const aviso = idea && idea.nota
    ? t('confirmBorrarIdeaNota')
    : t('confirmBorrarIdea');
  if (!confirm(aviso)) return;
  borrarTarea(ideaAbierta);
  cerrarIdea();
};

document.getElementById('ideaCancelar').onclick = cerrarIdea;

// Tocar el fondo oscuro (no la tarjeta) también cierra
modalIdea.onclick = (ev) => { if (ev.target === modalIdea) cerrarIdea(); };

/* ---------- Ñ. AJUSTES: IDIOMA, TEMA Y TU NOMBRE ----------
   Tres ajustes de ESTE dispositivo. Ninguno viaja a la nube ni entra en las
   copias de seguridad: no son datos de hábitos, son cómo prefieres ver la app
   en este teléfono.                                                          */

/**
 * Aplica el tema poniendo `data-tema` en la etiqueta <html>.
 *
 * "Automático" no es un tercer juego de colores: se resuelve a claro u oscuro
 * preguntándole al sistema. Así el CSS solo conoce dos temas.
 *
 * Esta función es la versión completa del trocito que está arriba en el <head>.
 * Aquella corre antes de dibujar (para que no parpadee) y esta corre cuando
 * cambias la opción.
 */
function aplicarTema() {
  const elegido = datos.prefs.tema || 'auto';
  const oscuro = elegido === 'oscuro' || (elegido === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);

  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';

  // Con la app instalada en la pantalla de inicio, el iPhone pinta la barra de
  // estado de arriba con este color. Si no se actualiza, en tema claro queda
  // una franja negra arriba que no pega con nada.
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', oscuro ? '#0f1115' : '#f4f5f7');
}

function cambiarIdioma(id) {
  datos.prefs.idioma = id;
  guardar();
  // El atributo lang le dice al navegador en qué idioma está la página: de eso
  // dependen el corrector ortográfico y cómo lo lee VoiceOver.
  document.documentElement.lang = id;
  refrescarTodo();
}

function cambiarTema(id) {
  datos.prefs.tema = id;
  guardar();
  aplicarTema();
  pintarAjustes();
}

/* Redibuja la app entera. Hace falta al cambiar de idioma porque los textos
   están repartidos en cuatro sitios que se dibujan por separado: la pantalla
   de hábitos, la lista en la que estés, el panel de cuenta y los propios
   botones de Ajustes. */
function refrescarTodo() {
  if (vista === 'habitos') pintar();
  else                     cambiarVista(vista);
  pintarLista();
  pintarSesion();
  pintarAjustes();
}

/* Dibuja los dos grupos de botones. Se genera desde las listas IDIOMAS y TEMAS
   en vez de escribir cinco botones en el HTML: agregar un idioma mañana es
   agregar un objeto a la lista, sin tocar ni el HTML ni esta función. */
function pintarAjustes() {
  const cajaIdiomas = document.getElementById('idiomas');
  cajaIdiomas.innerHTML = '';
  IDIOMAS.forEach(idioma => {
    const boton = document.createElement('button');
    boton.textContent = idioma.nombre;         // los idiomas no se traducen
    boton.className = datos.prefs.idioma === idioma.id ? 'activo' : '';
    boton.onclick = () => cambiarIdioma(idioma.id);
    cajaIdiomas.appendChild(boton);
  });

  const cajaTemas = document.getElementById('temas');
  cajaTemas.innerHTML = '';
  TEMAS.forEach(tema => {
    const boton = document.createElement('button');
    boton.textContent = t(tema.clave);         // estos sí
    boton.className = datos.prefs.tema === tema.id ? 'activo' : '';
    boton.onclick = () => cambiarTema(tema.id);
    cajaTemas.appendChild(boton);
  });

  document.getElementById('ajusteNombre').value = datos.prefs.nombre || '';
}

/* El nombre del saludo. Se guarda con 'input' (en cada tecla) y no al salir
   del campo: en un teléfono cerrar el teclado no siempre dispara 'blur', y
   perder lo escrito por eso sería el tipo de fallo que uno no entiende.

   Solo se repinta la cabecera, no la app entera: repintar la lista completa en
   cada tecla cerraría el teclado y te sacaría del campo. */
document.getElementById('ajusteNombre').addEventListener('input', ev => {
  datos.prefs.nombre = ev.target.value.trim().slice(0, 20);
  guardar();
  if (vista === 'habitos') pintar();
});

// Si el tema está en Automático y cambias el del iPhone (o entra solo de
// noche), la app lo sigue sin que tengas que abrirla de nuevo.
window.matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', () => {
        if ((datos.prefs.tema || 'auto') === 'auto') aplicarTema();
      });

/* ---------- K. ARRANCAR ---------- */
document.documentElement.lang = datos.prefs.idioma || 'es';
aplicarTema();
pintarAjustes();
pintar();
pintarLista();   // deja el contador de la pestaña puesto desde el arranque
</script>

<!-- La librería de Supabase, directo desde un CDN.
     type="module" hace falta para poder usar "import". Este bloque va
     aparte del script grande a propósito: los módulos se ejecutan al
     final, después de que todo lo de arriba ya existe.
     Si el CDN no responde, este bloque entero no llega a ejecutarse y
     la app sigue funcionando con los datos del teléfono. Es justo lo
     que queremos: la nube es un extra, no un requisito. -->
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  iniciarNube(createClient).catch(e => console.log('Nube:', e));
</script>

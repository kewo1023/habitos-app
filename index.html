<!DOCTYPE html>
<!--
  ============================================================
  MIS HÁBITOS — v0.1
  ============================================================
  Todo el proyecto vive en este único archivo. Tiene 3 partes:

    1. <style>  -> cómo se ve      (CSS)
    2. <body>   -> qué elementos hay (HTML)
    3. <script> -> qué hace         (JavaScript)

  Los datos se guardan en el propio teléfono/navegador con
  "localStorage". No hay servidor, no hay internet, no hay cuentas.
  ============================================================
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Esta línea hace que se vea bien en pantalla de teléfono -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mis Hábitos</title>

  <!-- Estas líneas son las que hacen que, al agregarla a la pantalla
       de inicio del iPhone, se abra sin barra de Safari y con ícono propio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hábitos">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1115">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="icon" href="icono-192.png">
  <link rel="manifest" href="manifest.json">

<style>
/* ---------- 1. VARIABLES: los colores en un solo sitio ---------- */
:root {
  --fondo:        #0f1115;
  --tarjeta:      #191c23;
  --tarjeta-alta: #22262f;
  --tarjeta-hecha:#12141a;   /* más oscura que la normal: el hábito ya cumplido "se hunde" */
  --borde:        #2a2f3a;
  --texto:        #e8eaed;
  --texto-suave:  #8b919d;
  --acento:       #5b8def;
  --exito:        #3ecf8e;
}

/* ---------- 2. RESET: quitar los estilos raros por defecto ---------- */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--fondo);
  color: var(--texto);
  /* padding extra arriba/abajo para el "notch" del iPhone */
  padding: max(20px, env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom));
  max-width: 620px;
  margin: 0 auto;
  min-height: 100vh;
  -webkit-user-select: none;
  user-select: none;
}

/* ---------- 3. CABECERA ---------- */
header { margin-bottom: 22px; }

.fecha {
  font-size: 13px;
  color: var(--texto-suave);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 600;
}

.titulo {
  font-size: 30px;
  font-weight: 700;
  margin-top: 4px;
  letter-spacing: -0.5px;
}

/* Barra de progreso del día */
.progreso-caja { margin-top: 18px; }

.progreso-texto {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--texto-suave);
  margin-bottom: 8px;
}

.progreso-fondo {
  height: 8px;
  background: var(--tarjeta-alta);
  border-radius: 99px;
  overflow: hidden;
}

.progreso-barra {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--acento), var(--exito));
  border-radius: 99px;
  transition: width .45s cubic-bezier(.2,.8,.2,1);
}

/* ---------- 4. TARJETA DE HÁBITO ---------- */
.habito {
  background: var(--tarjeta);
  border: 1px solid var(--borde);
  border-radius: 18px;
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform .12s ease, background .2s ease;
}

.habito:active { transform: scale(0.98); }

/* Cuando el hábito ya está hecho hoy.
   Cuatro señales a la vez, para que se note de un vistazo sin leer:
     1. fondo más oscuro -> la tarjeta se hunde en vez de resaltar
     2. barra verde a la izquierda (box-shadow "inset" = sombra por dentro;
        la usamos en vez de un border para que no mueva el contenido)
     3. borde verdoso tenue
     4. toda la tarjeta un poco desvanecida */
.habito.hecho {
  background: var(--tarjeta-hecha);
  border-color: rgba(62, 207, 142, .30);
  box-shadow: inset 3px 0 0 var(--exito);
  opacity: .72;
}

.habito.hecho .habito-nombre { color: var(--texto-suave); text-decoration: line-through; }

.habito-emoji {
  font-size: 26px;
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: 14px;
  background: var(--tarjeta-alta);
  flex-shrink: 0;
}

.habito-info { flex: 1; min-width: 0; }

.habito-nombre {
  font-size: 16px;
  font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Los 7 puntitos de la última semana */
.semana { display: flex; gap: 4px; margin-top: 7px; align-items: center; }

/* Los 11px son tu ajuste y se respetan como medida ideal, pero ahora los
   puntos pueden encoger si hace falta. Eso es lo que dice "flex: 0 1 11px":
     0  -> nunca crezcas más de 11px
     1  -> sí puedes encoger si no cabes
     11px -> tu tamaño preferido
   Antes eran 11px rígidos: 14 puntos ocupaban todo el ancho y la racha se
   caía a la línea de abajo. aspect-ratio: 1 los mantiene redondos al encoger. */
.dia {
  flex: 0 1 11px;
  min-width: 6px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--borde);
}

.dia.lleno { background: var(--exito); }

.racha {
  font-size: 12px;
  color: var(--texto-suave);
  margin-left: 8px;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;       /* los puntos ceden espacio, la racha no */
  white-space: nowrap;  /* el 🔥 y el número nunca se separan en dos líneas */
}

/* El círculo que se marca al tocar */
.check {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 2px solid var(--borde);
  display: grid; place-items: center;
  flex-shrink: 0;
  cursor: pointer;
  transition: all .2s ease;
  font-size: 16px;
  color: transparent;
}

.habito.hecho .check {
  background: var(--exito);
  border-color: var(--exito);
  color: #0f1115;
}

/* Botones de mover y borrar. Solo aparecen en modo edición, donde
   reemplazan al círculo de marcar. */
.acciones { display: none; gap: 2px; align-items: center; flex-shrink: 0; }

body.editando .acciones { display: flex; }
body.editando .check    { display: none; }

.acciones button {
  background: none; border: none;
  color: var(--texto-suave);
  font-size: 18px; cursor: pointer;
  padding: 6px 7px;
  font-family: inherit;
  line-height: 1;
}

/* Un hábito que ya está arriba del todo no puede subir más:
   en vez de esconder el botón, lo apagamos. Si desapareciera,
   los botones se moverían de sitio y terminarías tocando el que no era. */
.acciones button:disabled { opacity: .2; cursor: default; }

.borrar { font-size: 20px; }

/* En modo edición el nombre y el emoji se pueden tocar para cambiarlos.
   El punteado es la pista de que ahí se puede tocar. */
body.editando .habito-nombre {
  border-bottom: 1px dashed var(--borde);
  display: inline-block;
  max-width: 100%;
}

body.editando .habito-emoji { border-style: dashed; border-color: var(--acento); }

/* ---------- 4b. PANEL DE COPIA DE SEGURIDAD ----------
   Solo aparece en modo edición, para no estorbar en el uso diario */
.panel-datos {
  display: none;
  margin-top: 26px;
  padding: 16px;
  background: var(--tarjeta);
  border: 1px solid var(--borde);
  border-radius: 18px;
}

body.editando .panel-datos { display: block; }

.panel-botones { display: flex; gap: 8px; margin-top: 10px; }

.btn-mini {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--borde);
  background: var(--fondo);
  color: var(--texto);
  font-family: inherit;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
}

.btn-mini:active { background: var(--tarjeta-alta); }

.nota {
  font-size: 12px;
  color: var(--texto-suave);
  margin-top: 12px;
  line-height: 1.5;
}

/* ---------- 4c. LA SECCIÓN DE PENDIENTES ----------
   La app ahora tiene dos secciones. Piénsalo como dos hojas del mismo
   libro de Excel: los datos viven en el mismo archivo, pero miras una
   a la vez. Aquí abajo está todo lo visual de la segunda hoja.        */

/* Las dos pestañas de arriba */
.pestanas {
  display: flex;
  gap: 6px;
  background: var(--tarjeta);
  border: 1px solid var(--borde);
  border-radius: 14px;
  padding: 4px;
  margin-top: 16px;
}

.pestana {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: none;
  color: var(--texto-suave);
  font-family: inherit;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: background .18s ease, color .18s ease;
}

/* La pestaña en la que estás parado se ilumina. Es la única pista de
   "dónde estoy", así que tiene que notarse sin pensarlo. */
.pestana.activa {
  background: var(--tarjeta-alta);
  color: var(--texto);
}

/* El contador de pendientes ahí mismo, en la pestaña. Así sabes si hay
   algo esperándote sin tener que entrar a mirar. */
.pestana .cuantas {
  font-size: 12px;
  color: var(--acento);
  font-variant-numeric: tabular-nums;
}

/* Cambiar de sección = esconder una lista y mostrar la otra.
   El "hidden" del HTML hace el trabajo; esto solo se asegura de que
   nada lo sobrescriba. */
[hidden] { display: none !important; }

/* Los paneles de copia y cuenta son cosa de los hábitos. En pendientes
   estorban, así que no aparecen aunque estés en modo edición. */
body.vista-tareas .panel-datos { display: none; }

/* --- El campo para escribir un pendiente ---
   Va siempre visible arriba de la lista, no dentro de una ventana.
   Es a propósito: anotar algo tiene que costar un toque, no tres. */
.nueva-tarea {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

/* El input global trae margen abajo y aquí no lo queremos: el margen
   lo pone .nueva-tarea para los dos elementos a la vez. */
.nueva-tarea input[type=text] { margin-bottom: 0; }

/* Safari mete un iconito de llave dentro de los campos donde cree que
   podrías querer rellenar una contraseña. Aquí no aplica nunca, así que
   lo escondemos. Es un pseudo-elemento propio de Safari/Chrome: el
   prefijo -webkit- significa "esto solo lo entienden estos navegadores". */
#tareaNueva::-webkit-credentials-auto-fill-button,
#tareaNueva::-webkit-contacts-auto-fill-button {
  visibility: hidden;
  pointer-events: none;
  width: 0;
  margin: 0;
}

.nueva-tarea button {
  flex: 0 0 52px;
  border-radius: 13px;
  border: none;
  background: var(--acento);
  color: #fff;
  font-size: 22px; font-family: inherit;
  cursor: pointer;
}

/* --- La tarjeta de un pendiente ---
   Más baja que la de un hábito: no lleva puntitos ni racha, solo
   texto. Una tarea no tiene historial que enseñar. */
.tarea {
  background: var(--tarjeta);
  border: 1px solid var(--borde);
  border-radius: 16px;
  padding: 13px 15px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 13px;
  transition: transform .12s ease, background .2s ease;
}

.tarea:active { transform: scale(0.98); }

/* Las hechas se hunden, igual que un hábito cumplido. Mismas señales
   visuales en las dos secciones = una sola regla que aprender. */
.tarea.hecha {
  background: var(--tarjeta-hecha);
  border-color: rgba(62, 207, 142, .30);
  box-shadow: inset 3px 0 0 var(--exito);
  opacity: .62;
}

.tarea.hecha .tarea-texto {
  color: var(--texto-suave);
  text-decoration: line-through;
}

.tarea-texto {
  flex: 1;
  min-width: 0;
  font-size: 16px;
  font-weight: 500;
  /* A diferencia del nombre de un hábito, un pendiente puede ser largo
     ("llamar al del seguro del carro"). Que baje de línea en vez de
     cortarse con puntos suspensivos. */
  overflow-wrap: anywhere;
  line-height: 1.35;
}

body.editando .tarea-texto {
  border-bottom: 1px dashed var(--borde);
  display: inline-block;
}

/* Al marcar una tarea, esta se va al final de la lista. Como redibujamos
   todo de golpe, sin esto la tarjeta simplemente "aparecería" abajo y se
   sentiría un salto. Esta animación corta dice "me moví a propósito". */
@keyframes aterrizar {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.tarea.recien-movida { animation: aterrizar .28s ease-out; }

/* El botón de limpiar las hechas. Solo se dibuja si hay alguna. */
.limpiar-hechas {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  border-radius: 12px;
  border: 1px dashed var(--borde);
  background: none;
  color: var(--texto-suave);
  font-family: inherit;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
}

.limpiar-hechas:active { background: var(--tarjeta); }

/* ---------- 5. ESTADO VACÍO ---------- */
.vacio {
  text-align: center;
  padding: 60px 20px;
  color: var(--texto-suave);
}

.vacio-emoji { font-size: 44px; margin-bottom: 14px; }

/* ---------- 6. BOTONES DE ABAJO ---------- */
.barra-inferior {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--fondo) 65%, transparent);
  display: flex; gap: 10px;
  max-width: 620px; margin: 0 auto;
}

.btn {
  flex: 1;
  padding: 15px;
  border-radius: 15px;
  border: none;
  font-size: 15px; font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}

.btn-principal  { background: var(--acento); color: #fff; }
.btn-secundario { background: var(--tarjeta); color: var(--texto-suave);
                  border: 1px solid var(--borde); flex: 0 0 90px; }

/* ---------- 7. VENTANA PARA AGREGAR HÁBITO ---------- */
.fondo-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.65);
  display: none;
  align-items: flex-end;
  z-index: 10;
}

.fondo-modal.abierto { display: flex; }

.modal {
  background: var(--tarjeta);
  width: 100%;
  border-radius: 26px 26px 0 0;
  padding: 26px 20px calc(26px + env(safe-area-inset-bottom));
  max-width: 620px; margin: 0 auto;
  animation: subir .25s cubic-bezier(.2,.8,.2,1);
}

@keyframes subir { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal h2 { font-size: 19px; margin-bottom: 18px; }

.etiqueta {
  font-size: 12px; color: var(--texto-suave);
  text-transform: uppercase; letter-spacing: 1px;
  font-weight: 600; margin-bottom: 8px; display: block;
}

input[type=text], input[type=email], input[type=password] {
  width: 100%;
  padding: 14px;
  background: var(--fondo);
  border: 1px solid var(--borde);
  border-radius: 13px;
  color: var(--texto);
  font-size: 16px; /* 16px evita que el iPhone haga zoom al escribir */
  font-family: inherit;
  margin-bottom: 18px;
  -webkit-user-select: text; user-select: text;
}

input[type=text]:focus, input[type=email]:focus, input[type=password]:focus {
  outline: none; border-color: var(--acento);
}

/* ---------- 10. PANEL DE CUENTA ---------- */
.panel-datos input { margin-bottom: 8px; }

.sesion-estado { font-size: 12px; margin-top: 10px; line-height: 1.5; }
.sesion-estado.error { color: #ff8a80; }
.sesion-estado.bien  { color: var(--exito); }

.emojis { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }

.emoji-op {
  width: 46px; height: 46px;
  border-radius: 13px;
  background: var(--fondo);
  border: 2px solid transparent;
  font-size: 22px;
  cursor: pointer;
  display: grid; place-items: center;
}

.emoji-op.elegido { border-color: var(--acento); }

/* ---------- 8. CALENDARIO MENSUAL ---------- */

/* El emoji del hábito ahora se puede tocar: abre su calendario.
   El borde tenue es la pista visual de que ahí se puede tocar. */
.habito-emoji { cursor: pointer; border: 1px solid var(--borde); }

.cal-cabecera {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.cal-cabecera h2 { margin-bottom: 2px; }

.cal-titulo-caja { flex: 1; min-width: 0; text-align: center; }

.cal-mes {
  font-size: 13px;
  color: var(--texto-suave);
  text-transform: capitalize;
}

.cal-flecha {
  background: var(--fondo);
  border: 1px solid var(--borde);
  color: var(--texto);
  width: 38px; height: 38px;
  border-radius: 12px;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
}

.cal-flecha:active { background: var(--tarjeta-alta); }

/* "grid" = cuadrícula. 7 columnas = los 7 días de la semana.
   Es la pieza clave: le decimos "7 columnas iguales" y los días
   se van acomodando solos, saltando de fila cuando toca. */
.cal-nombres, .cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.cal-nombres {
  margin-bottom: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--texto-suave);
  text-align: center;
  text-transform: uppercase;
}

.cal-dia {
  aspect-ratio: 1;          /* cuadrado perfecto, mida lo que mida */
  border-radius: 10px;
  border: 1px solid transparent;
  background: var(--fondo);
  color: var(--texto-suave);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: grid; place-items: center;
}

.cal-dia.hecho   { background: var(--exito); color: #0f1115; }
.cal-dia.hoy     { border-color: var(--acento); }
.cal-dia.futuro  { opacity: .25; cursor: default; }

/* Con el calendario y las estadísticas, la ventana creció.
   Esto evita que se salga de la pantalla en teléfonos pequeños. */
.modal { max-height: 92vh; overflow-y: auto; }

/* ---------- 9. ESTADÍSTICAS ----------
   auto-fit + minmax = "mete las columnas que quepan, mínimo 72px cada una".
   Así se acomodan solas: 4 en fila en un iPhone, 2 y 2 si la pantalla es
   más angosta. No hay que escribir ninguna regla para cada tamaño. */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
  gap: 8px;
  margin-top: 14px;
}

.stat {
  background: var(--fondo);
  border: 1px solid var(--borde);
  border-radius: 12px;
  padding: 10px 6px;
  text-align: center;
  cursor: pointer;
  font-family: inherit;
  color: var(--texto);
}

.stat.activa { border-color: var(--acento); }

/* La explicación que aparece al tocar una estadística.
   min-height reserva el espacio de dos líneas desde el principio: sin eso,
   la ventana daría un salto cada vez que aparece o desaparece el texto. */
.cal-ayuda {
  font-size: 12px;
  line-height: 1.5;
  color: var(--texto-suave);
  margin-top: 12px;
  min-height: 36px;
}

.stat-numero {
  font-size: 19px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;  /* que no bailen los números al cambiar */
}

.stat-etiqueta {
  font-size: 10px;
  color: var(--texto-suave);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-top: 3px;
  line-height: 1.3;
}
</style>
</head>

<body>

  <!-- ====== HTML: la estructura visible ====== -->
  <header>
    <div class="fecha" id="fecha"></div>
    <div class="titulo">Mis Hábitos</div>

    <div class="progreso-caja" id="cajaProgreso">
      <div class="progreso-texto">
        <span id="progresoEtiqueta">Hoy</span>
        <span id="progresoTexto">0 de 0</span>
      </div>
      <div class="progreso-fondo"><div class="progreso-barra" id="barra"></div></div>
    </div>

    <!-- Las dos secciones de la app. El número de pendientes lo pone JS. -->
    <div class="pestanas">
      <button class="pestana activa" id="pestanaHabitos">Hábitos</button>
      <button class="pestana" id="pestanaTareas">Pendientes <span class="cuantas" id="contadorTareas"></span></button>
    </div>
  </header>

  <!-- Aquí JavaScript va a insertar las tarjetas de hábitos -->
  <main id="lista"></main>

  <!-- La segunda sección. Arranca oculta: la app siempre abre en Hábitos,
       que es el gesto diario. Pendientes es un desvío voluntario. -->
  <main id="listaTareas" hidden>
    <!-- El campo de captura va arriba y siempre visible: escribir un
         pendiente tiene que ser un toque, no abrir una ventana. -->
    <!-- Va dentro de su propio <form> para quedar en un "recinto" distinto al
         del login. Así Safari deja de ofrecerte tu contraseña aquí.
         El name="pendiente" también cuenta: Safari adivina para qué sirve un
         campo por su nombre y su texto de ayuda, no solo por autocomplete. -->
    <form class="nueva-tarea" id="formTarea" autocomplete="off">
      <input type="text" id="tareaNueva" name="pendiente"
             placeholder="¿Qué tienes pendiente?"
             maxlength="120" autocomplete="off" enterkeyhint="done"
             autocorrect="off" data-lpignore="true">
      <button type="submit" id="btnAgregarTarea" aria-label="Agregar pendiente">+</button>
    </form>

    <!-- Aquí JavaScript inserta las tarjetas de pendientes -->
    <div id="tareasCuerpo"></div>
  </main>

  <!-- Copia de seguridad. Solo se ve al tocar "Editar" -->
  <section class="panel-datos">
    <span class="etiqueta">Copia de seguridad</span>
    <div class="panel-botones">
      <button class="btn-mini" id="btnExportar">↓ Guardar copia</button>
      <button class="btn-mini" id="btnImportar">↑ Restaurar copia</button>
    </div>
    <!-- Este input abre el selector de archivos. Va oculto porque el
         botón de arriba es más bonito; al tocarlo, lo activamos desde JS -->
    <input type="file" id="archivoEntrada" accept=".json,application/json" hidden>
    <p class="nota">Tus hábitos viven solo en este dispositivo. Guarda una copia
      de vez en cuando: si borras la app, se pierde el historial.</p>
  </section>

  <!-- Cuenta. También solo en modo edición: entrar es algo que se hace
       una vez por dispositivo, no todos los días. -->
  <section class="panel-datos">
    <span class="etiqueta">Cuenta</span>

    <!-- Lo que se ve cuando NO has entrado.
         Los dos campos van dentro de un <form> a propósito. Sin él, Safari
         trata la página entera como un formulario y ofrece rellenar tu

               autocomplete="current-password">

  <div class="barra-inferior">
    <button class="btn btn-principal"  id="btnAgregar">+ Nuevo hábito</button>
    <button class="btn btn-secundario" id="btnEditar">Editar</button>
  </div>

  <!-- Ventana emergente para crear un hábito -->
  <div class="fondo-modal" id="modal">
    <div class="modal">
      <h2>Nuevo hábito</h2>

      <label class="etiqueta" for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Ej: Leer 20 minutos" maxlength="40" autocomplete="off">

      <label class="etiqueta">Ícono</label>
      <div class="emojis" id="emojis"></div>

      <!-- La escotilla de escape: si ninguno de arriba sirve, escribe el
           tuyo con el teclado de emojis del teléfono. Lo que escribas aquí
           tiene prioridad sobre el que esté seleccionado. -->
      <input type="text" id="emojiLibre" maxlength="8" autocomplete="off"
             placeholder="…o escribe el tuyo 😀">

      <div style="display:flex; gap:10px">
        <button class="btn btn-secundario" id="btnCancelar" style="flex:1">Cancelar</button>

  <!-- Calendario de un hábito. Se abre al tocar su emoji.
       Los días se generan desde JavaScript, por eso calGrid va vacío. -->
  <div class="fondo-modal" id="modalCal">
    <div class="modal">
      <div class="cal-cabecera">
        <button class="cal-flecha" id="calAtras">‹</button>
        <div class="cal-titulo-caja">
          <h2 id="calTitulo">Hábito</h2>
          <div class="cal-mes" id="calMes"></div>
        </div>
        <button class="cal-flecha" id="calAdelante">›</button>
      </div>

      <div class="cal-nombres">
        <span>L</span><span>M</span><span>M</span><span>J</span>
        <span>V</span><span>S</span><span>D</span>
      </div>

      <div class="cal-grid" id="calGrid"></div>

      <p class="nota" id="calResumen"></p>

      <!-- Estadísticas del hábito. Los números los pone JavaScript. -->
      <div class="stats" id="calStats"></div>
      <p class="cal-ayuda" id="calAyuda"></p>

      <button class="btn btn-secundario" id="calCerrar"
              style="width:100%; flex:none; margin-top:16px">Cerrar</button>
    </div>
  </div>

<script>
/* ============================================================
   JAVASCRIPT — la lógica de la app
   Leelo de arriba a abajo, está en orden de importancia.
   ============================================================ */

/* ---------- A. GUARDAR Y LEER DATOS ----------
   localStorage solo guarda TEXTO. Por eso convertimos nuestro
   objeto a texto con JSON.stringify al guardar, y de texto a
   objeto con JSON.parse al leer.                                */

const CLAVE = 'habitos-app-v1';

// Esta es la "forma" de nuestros datos. Piénsalo como tablas:
//   habitos  -> una fila por hábito
//   registros-> qué hábitos se marcaron en cada fecha
//   tareas   -> una fila por pendiente (la segunda sección de la app)
// "pendientes" es la cola de cambios que faltan por subir a la nube.
//
// OJO con los nombres, porque se parecen y no son lo mismo:
//   datos.tareas     = tu lista de cosas por hacer (lo que ves en pantalla)
//   datos.pendientes = cambios que faltan por subir a Supabase (interno)
const datosPorDefecto = { version: 1, habitos: [], registros: {}, tareas: [], pendientes: [] };

function cargar() {
  try {
    const texto = localStorage.getItem(CLAVE);
    const leidos = texto ? JSON.parse(texto) : structuredClone(datosPorDefecto);

    // Los datos guardados antes de la Fase 3 no traen cola. Se la ponemos
    // al vuelo en vez de obligarte a borrar y empezar de cero.
    if (!Array.isArray(leidos.pendientes)) leidos.pendientes = [];

    // Lo mismo con la lista de tareas: los datos guardados antes de que
    // existiera la sección de Pendientes no la traen. Este patrón se repite
    // cada vez que agregamos algo al modelo, y es lo que permite estrenar
    // una función sin que pierdas lo que ya tenías.
    if (!Array.isArray(leidos.tareas)) leidos.tareas = [];

    return leidos;
  } catch (e) {
    // Si algo se corrompe, mejor arrancar limpio que romperse
    console.error('No se pudieron leer los datos:', e);
    return structuredClone(datosPorDefecto);
  }
}

function guardar() {
  localStorage.setItem(CLAVE, JSON.stringify(datos));
}

/* La idea central de la sincronización, en una función.
   Cada cambio se guarda en el teléfono Y se anota en una cola de "esto
   falta subirlo". Si hay señal, la cola se vacía enseguida. Si no, la
   nota espera ahí, guardada, hasta que vuelva. Por eso la app se siente
   igual de rápida sin internet: nunca espera a la nube para nada.

   El "if" del final es lo que mantiene esta sección independiente: la
   cola existe aunque la nube no haya cargado o ni siquiera exista. */
function encolar(pendiente) {
  datos.pendientes.push(pendiente);
  guardar();
  if (typeof pedirSincronizar === 'function') pedirSincronizar();
}

let datos = cargar();

/* ---------- B. FECHAS ----------
   Usamos el formato "2026-08-01" (año-mes-día) porque así las
   fechas se ordenan solas alfabéticamente. Es el mismo formato
   DATE de SQL, te va a resultar familiar.                       */

function claveFecha(fecha) {
  const y = fecha.getFullYear();
  const m = String(fecha.getMonth() + 1).padStart(2, '0'); // los meses van de 0 a 11
  const d = String(fecha.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function hoy() { return claveFecha(new Date()); }

function haceNDias(n) {
  const f = new Date();
  f.setDate(f.getDate() - n);
  return claveFecha(f);
}

/* --- Fechas para el calendario ---
   Aquí el mes va de 1 a 12 (como lo dirías hablando), no de 0 a 11
   como lo maneja JavaScript por dentro. Es una decisión: prefiero
   traducir en un solo sitio a estar restando 1 por todo el código. */

// Arma la clave de fecha a partir de tres números sueltos.
function claveDe(anio, mes, dia) {
  return `${anio}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
}

// ¿Cuántos días tiene este mes? Truco clásico: pedirle a JavaScript
// el "día 0" del mes siguiente. El día 0 no existe, así que retrocede
// uno y cae en el último día del mes que queremos. Así no hay que
// acordarse de febrero ni de los años bisiestos.
function diasDelMes(anio, mes) {
  return new Date(anio, mes, 0).getDate();
}

// ¿En qué columna empieza el día 1? La semana la mostramos de lunes a
// domingo, pero getDay() cuenta 0=domingo ... 6=sábado. El (+6) % 7
// rota esa numeración para que el lunes quede en 0.
function columnaInicio(anio, mes) {
  const diaSemana = new Date(anio, mes - 1, 1).getDay();
  return (diaSemana + 6) % 7;
}

// Comparar fechas es comparar texto, y funciona: al estar en formato
// AAAA-MM-DD, el orden alfabético coincide con el cronológico. Es la
// misma razón por la que elegimos este formato desde el principio.
function esFutura(fecha) {
  return fecha > hoy();
}

/* ---------- C. CONSULTAS SOBRE LOS DATOS ---------- */

// ¿Este hábito está marcado en esta fecha?
function estaHecho(idHabito, fecha) {
  const delDia = datos.registros[fecha] || [];
  return delDia.includes(idHabito);
}

// Todas las fechas en que se marcó un hábito, ordenadas de vieja a nueva.
// En SQL: SELECT fecha FROM registros WHERE habito = ? ORDER BY fecha
// Ordenar textos AAAA-MM-DD ya los deja en orden cronológico.
function fechasDe(idHabito) {
  return Object.keys(datos.registros)
    .filter(f => datos.registros[f].includes(idHabito))
    .sort();
}

// Cuántos días en total se ha marcado. El COUNT(*) de toda la vida.
function totalDias(idHabito) {
  return fechasDe(idHabito).length;
}

// Cuántos días hay entre dos fechas.
// Ojo con el 'T00:00:00': sin eso, JavaScript interpreta "2026-08-04" como
// medianoche en Londres, y en Colombia eso cae el día anterior. Agregándolo
// se lee como medianoche local, que es lo que queremos.
// El Math.round es por el horario de verano: en los países que lo usan hay
// días de 23 o 25 horas y la división daría 30.958 en vez de 31.
function diasEntre(desde, hasta) {
  const a = new Date(desde + 'T00:00:00');
  const b = new Date(hasta + 'T00:00:00');
  return Math.round((b - a) / 86400000);   // milisegundos que tiene un día
}

// La racha más larga que ha logrado, en toda su historia.
// La idea: recorrer sus fechas en orden y llevar dos cuentas — la racha que
// viene corriendo y la mejor vista hasta ahora. Cada vez que un día NO es el
// siguiente del anterior, la racha se reinicia en 1.
function mejorRacha(idHabito) {
  const fechas = fechasDe(idHabito);
  let mejor = 0;
  let corriendo = 0;
  let anterior = null;

  for (const f of fechas) {
    // ¿este día es exactamente el siguiente del anterior?
    if (anterior !== null && diasEntre(anterior, f) === 1) corriendo++;
    else corriendo = 1;

    if (corriendo > mejor) mejor = corriendo;
    anterior = f;
  }
  return mejor;
}

// Desde qué día "cuenta" este hábito, para calcular porcentajes justos.
// Normalmente es su fecha de creación, pero tomamos la más antigua entre esa
// y su primer día marcado: con el calendario ahora puedes marcar días
// anteriores a la creación, y si no, el porcentaje se pasaría de 100%.
function fechaInicio(idHabito) {
  const h = datos.habitos.find(x => x.id === idHabito);
  const candidatas = [h && h.creado, fechasDe(idHabito)[0]].filter(Boolean).sort();
  return candidatas[0] || hoy();
}

// Cuántos días lleva vivo el hábito, contando hoy.
function diasDeVida(idHabito) {
  return diasEntre(fechaInicio(idHabito), hoy()) + 1;   // +1 para incluir el día de inicio
}

// Porcentaje de cumplimiento en los últimos n días.
// Si el hábito es más nuevo que n, medimos solo desde que existe: no tiene
// sentido castigarlo por días en los que todavía no lo habías creado.
function porcentajeUltimos(idHabito, n) {
  const dias = Math.min(n, diasDeVida(idHabito));
  if (dias <= 0) return 0;

  let hechos = 0;
  for (let i = 0; i < dias; i++) {
    if (estaHecho(idHabito, haceNDias(i))) hechos++;
  }
  return Math.round(hechos / dias * 100);
}

// Cuántos días seguidos lleva. Si hoy todavía no lo marca, la racha
// de ayer hacia atrás sigue contando (no lo castigamos a las 8am).
function calcularRacha(idHabito) {
  let racha = 0;
  let inicio = estaHecho(idHabito, hoy()) ? 0 : 1;
  for (let i = inicio; i < 3650; i++) {
    if (estaHecho(idHabito, haceNDias(i))) racha++;
    else break;
  }
  return racha;
}

// Cuántas veces se marcó este hábito en un mes concreto.
// En SQL sería: SELECT COUNT(*) ... WHERE fecha LIKE '2026-08%'
function contarMes(idHabito, anio, mes) {
  let total = 0;
  for (let d = 1; d <= diasDelMes(anio, mes); d++) {
    if (estaHecho(idHabito, claveDe(anio, mes, d))) total++;
  }
  return total;
}

/* ---------- D. ACCIONES (cambian los datos) ---------- */

// Marca o desmarca un hábito en CUALQUIER fecha, no solo hoy.
// Devuelve true si cambió algo, false si no se permitió.
function alternarFecha(idHabito, fecha) {
  if (esFutura(fecha)) return false;   // el futuro no se marca

  if (!datos.registros[fecha]) datos.registros[fecha] = [];

  const posicion = datos.registros[fecha].indexOf(idHabito);
  if (posicion === -1) {
    datos.registros[fecha].push(idHabito);                      // marcar
    encolar({ tipo: 'marcar', id: idHabito, fecha: fecha });
  } else {
    datos.registros[fecha].splice(posicion, 1);                 // desmarcar
    encolar({ tipo: 'desmarcar', id: idHabito, fecha: fecha });
  }

  // Si el día quedó sin nada, borramos la clave entera: no vale la pena
  // guardar filas vacías. Mantiene la copia de seguridad limpia.
  if (datos.registros[fecha].length === 0) delete datos.registros[fecha];

  guardar();
  pintar();
  return true;
}

// Marcar hoy pasa a ser un caso particular de lo anterior.
function alternarHoy(idHabito) {
  return alternarFecha(idHabito, hoy());
}

function agregarHabito(nombre, emoji) {
  const id = crypto.randomUUID();   // un identificador único, como una PRIMARY KEY
  datos.habitos.push({ id: id, nombre: nombre, emoji: emoji, creado: hoy() });

  encolar({ tipo: 'guardarHabito', id: id });
  guardar();
  pintar();
}

// Cambia el nombre de un hábito. Devuelve true si cambió algo.
// El historial no se toca: vive atado al id, no al nombre. Es la ventaja de
// haber usado un id como PRIMARY KEY en vez del nombre.
function renombrarHabito(idHabito, nombreNuevo) {
  const limpio = (nombreNuevo || '').trim();
  if (!limpio) return false;                 // un nombre vacío no sirve

  const h = datos.habitos.find(x => x.id === idHabito);
  if (!h) return false;
  if (h.nombre === limpio) return false;     // no cambió nada, no guardamos

  h.nombre = limpio.slice(0, 40);            // el mismo tope que el formulario

  encolar({ tipo: 'guardarHabito', id: idHabito });
  guardar();
  pintar();
  return true;
}

// Cambia el emoji de un hábito. Igual que renombrar: el historial no se
// mueve, porque cuelga del id y no de cómo se ve el hábito.
function cambiarEmoji(idHabito, emojiNuevo) {
  const simbolo = primerEmoji(emojiNuevo);
  if (!simbolo) return false;                // no era un emoji: no tocamos nada

  const h = datos.habitos.find(x => x.id === idHabito);
  if (!h || h.emoji === simbolo) return false;

  h.emoji = simbolo;
  encolar({ tipo: 'guardarHabito', id: idHabito });
  guardar();
  pintar();
  return true;
}

// Sube o baja un hábito en la lista. direccion: -1 sube, +1 baja.
// El orden en pantalla es simplemente el orden del array datos.habitos,
// así que mover un hábito es intercambiarlo con su vecino.
function moverHabito(idHabito, direccion) {
  const i = datos.habitos.findIndex(x => x.id === idHabito);
  if (i === -1) return false;

  const j = i + direccion;
  if (j < 0 || j >= datos.habitos.length) return false;   // ya está en el extremo

  // Intercambio de dos posiciones en una línea. Se lee así:
  // "que el de la izquierda pase a valer lo de la derecha, y viceversa".
  [datos.habitos[i], datos.habitos[j]] = [datos.habitos[j], datos.habitos[i]];

  // Los dos que se intercambiaron cambiaron de posición, así que hay que
  // subir los dos. La posición se lee al momento de enviar, no ahora.
  encolar({ tipo: 'guardarHabito', id: datos.habitos[i].id });
  encolar({ tipo: 'guardarHabito', id: datos.habitos[j].id });

  guardar();
  pintar();
  return true;
}

function borrarHabito(idHabito) {
  const h = datos.habitos.find(x => x.id === idHabito);
  if (!confirm(`¿Borrar "${h.nombre}"? Se pierde su historial.`)) return;

  datos.habitos = datos.habitos.filter(x => x.id !== idHabito);
  // También limpiamos su historial de todas las fechas
  for (const fecha in datos.registros) {
    datos.registros[fecha] = datos.registros[fecha].filter(x => x !== idHabito);
  }

  // En la nube basta con borrar el hábito: el "on delete cascade" de la
  // tabla registros se lleva su historial solo. Ese bucle de arriba existe
  // porque localStorage no sabe hacer eso.
  encolar({ tipo: 'borrarHabito', id: idHabito });

  guardar();
  pintar();
}

/* ---------- D2. PENDIENTES: LA LÓGICA ----------
   Esta es toda la inteligencia de la segunda sección. Está aquí arriba,
   junto al resto de la lógica, y no abajo con el dibujado, por una razón
   muy práctica: lo de aquí se puede probar con "node pruebas.js" y lo de
   abajo no. Una función que solo mueve datos se prueba sola; una que
   dibuja en pantalla hay que mirarla con los ojos.

   Una tarea es deliberadamente pobre:
     { id, texto, hecha, creada }
   Sin emoji, sin fecha límite, sin prioridad. Un hábito necesita historial
   porque su gracia es repetirse; una tarea se hace una vez y se acabó.
   Meterle campos "por si acaso" sería justo la fricción que no queremos.

   Nota: estas funciones NO llaman a encolar(). Los pendientes viven solo
   en este dispositivo por ahora, a propósito: primero los usamos unos días
   y solo entonces decidimos si merecen su propia tabla en Supabase.       */

function agregarTarea(texto) {
  const limpio = (texto || '').trim();
  if (!limpio) return false;              // una tarea vacía no es una tarea

  datos.tareas.push({
    id: crypto.randomUUID(),
    texto: limpio.slice(0, 120),          // el mismo tope que el campo del HTML
    hecha: false,
    creada: hoy()
  });

  guardar();
  pintarTareas();
  return true;
}

// Marca o desmarca. Devuelve true si encontró la tarea y la cambió.
function alternarTarea(idTarea) {
  const t = datos.tareas.find(x => x.id === idTarea);
  if (!t) return false;

  t.hecha = !t.hecha;
  guardar();
  pintarTareas();
  return true;
}

// Cambiar el texto. Misma idea que renombrar un hábito: se toca en modo
// edición. Devuelve false si el texto está vacío o no cambió nada, para
// no guardar en disco por gusto.
function renombrarTarea(idTarea, textoNuevo) {
  const limpio = (textoNuevo || '').trim();
  if (!limpio) return false;

  const t = datos.tareas.find(x => x.id === idTarea);
  if (!t) return false;
  if (t.texto === limpio) return false;

  t.texto = limpio.slice(0, 120);
  guardar();
  pintarTareas();
  return true;
}

// Borrar una tarea no pide confirmación, a diferencia de borrar un hábito.
// La diferencia es lo que se pierde: un hábito se lleva años de historial;
// una tarea es una línea de texto que vuelves a escribir en tres segundos.
// Además la ✕ solo existe en modo edición, que ya es una barrera.
function borrarTarea(idTarea) {
  const antes = datos.tareas.length;
  datos.tareas = datos.tareas.filter(x => x.id !== idTarea);
  if (datos.tareas.length === antes) return false;   // ese id no existía

  guardar();
  pintarTareas();
  return true;
}

// Barrer de una vez todas las hechas. Devuelve cuántas se llevó.
// En SQL sería: DELETE FROM tareas WHERE hecha = true
function limpiarHechas() {
  const cuantas = datos.tareas.filter(t => t.hecha).length;
  if (cuantas === 0) return 0;

  datos.tareas = datos.tareas.filter(t => !t.hecha);
  guardar();
  pintarTareas();
  return cuantas;
}

// El orden en que se dibujan: primero lo que falta, al final lo hecho.
// Dentro de cada grupo se respeta el orden en que las escribiste.
//
// Se hace con dos filtros en vez de con .sort() a propósito. Con sort
// habría que confiar en que no reordena los empates entre sí, y además
// costaría más leerlo. Dos filtros y un concat dicen exactamente lo que
// pasa: "las que faltan, y detrás las hechas".
//
// Es una función pura: recibe una lista y devuelve una lista nueva sin
// tocar la original. Por eso se puede probar sin arrancar la app.
function tareasOrdenadas(lista) {
  const todas = lista || datos.tareas;
  return todas.filter(t => !t.hecha).concat(todas.filter(t => t.hecha));
}

// Los números para el contador y la barra de progreso.
function contarTareas(lista) {
  const todas = lista || datos.tareas;
  const hechas = todas.filter(t => t.hecha).length;
  return { total: todas.length, hechas: hechas, faltan: todas.length - hechas };
}
/* ---------- fin D2 ---------- */

/* ---------- E. PINTAR LA PANTALLA ----------
   Regla de oro: los datos son la verdad. Cada vez que cambian,
   volvemos a dibujar todo desde cero. Es más simple y no se
   desincroniza nunca.                                           */

const lista = document.getElementById('lista');

function pintar() {
  // Fecha de arriba
  document.getElementById('fecha').textContent =
    new Date().toLocaleDateString('es-CO', { weekday:'long', day:'numeric', month:'long' });

  // Saludo personalizado según la hora del día
  const hora = new Date().getHours();
  let saludo = 'Buenas noches';
  if (hora < 12) saludo = 'Buenos días';
  else if (hora < 19) saludo = 'Buenas tardes';
  document.querySelector('.titulo').textContent = saludo + ', Kev';

  // Caso: todavía no hay hábitos
  if (datos.habitos.length === 0) {
    lista.innerHTML = `
      <div class="vacio">
        <div class="vacio-emoji">🌱</div>
        <div>Aún no tienes hábitos.<br>Empieza con uno o dos, no más.</div>
      </div>`;
    document.getElementById('cajaProgreso').style.visibility = 'hidden';
    return;
  }
  document.getElementById('cajaProgreso').style.visibility = 'visible';

  // Barra de progreso del día
  const hechosHoy = datos.habitos.filter(h => estaHecho(h.id, hoy())).length;
  document.getElementById('progresoTexto').textContent = `${hechosHoy} de ${datos.habitos.length}`;
  document.getElementById('barra').style.width = (hechosHoy / datos.habitos.length * 100) + '%';

  // Una tarjeta por hábito
  lista.innerHTML = '';
  datos.habitos.forEach((h, indice) => {
    const hecho = estaHecho(h.id, hoy());
    const racha = calcularRacha(h.id);
    const esPrimero = indice === 0;
    const esUltimo  = indice === datos.habitos.length - 1;

    // Los 7 puntitos: de hace 6 días hasta hoy
    let puntos = '';
    for (let i = 13; i >= 0; i--) {
      const lleno = estaHecho(h.id, haceNDias(i)) ? 'lleno' : '';
      puntos += `<div class="dia ${lleno}"></div>`;
    }

    const tarjeta = document.createElement('div');
    tarjeta.className = 'habito' + (hecho ? ' hecho' : '');
    tarjeta.innerHTML = `
      <div class="habito-emoji">${h.emoji}</div>
      <div class="habito-info">
        <div class="habito-nombre">${h.nombre}</div>
        <div class="semana">
          ${puntos}
          <span class="racha">${racha > 2 ? '🔥 ' + racha : ''}</span>
        </div>
      </div>
      <div class="check">✓</div>
      <div class="acciones">
        <button class="subir"  ${esPrimero ? 'disabled' : ''}>↑</button>
        <button class="bajar"  ${esUltimo  ? 'disabled' : ''}>↓</button>
        <button class="borrar">✕</button>
      </div>
    `;

    // Tocar la tarjeta = marcar/desmarcar
    tarjeta.querySelector('.check').onclick = () => alternarHoy(h.id);
    tarjeta.querySelector('.habito-info').onclick = () => {
      if (!document.body.classList.contains('editando')) alternarHoy(h.id);
    };
    tarjeta.querySelector('.borrar').onclick = () => borrarHabito(h.id);
    // El emoji hace dos cosas distintas según el modo: en uso normal abre
    // el calendario; en modo edición te deja cambiarlo. Es el mismo criterio
    // que el nombre, para no tener que aprender dos reglas.
    tarjeta.querySelector('.habito-emoji').onclick = () => {
      if (!document.body.classList.contains('editando')) {
        abrirCalendario(h.id);
        return;
      }
      const nuevo = prompt(`Nuevo emoji para "${h.nombre}":`, h.emoji);
      if (nuevo === null) return;                       // tocaste Cancelar
      if (!cambiarEmoji(h.id, nuevo) && primerEmoji(nuevo) === '') {
        alert('Eso no parece un emoji. Usa el teclado de emojis del teléfono.');
      }
    };

    // Reordenar (solo se ven en modo edición)
    tarjeta.querySelector('.subir').onclick = () => moverHabito(h.id, -1);
    tarjeta.querySelector('.bajar').onclick = () => moverHabito(h.id, 1);

    // Renombrar: tocar el nombre estando en modo edición.
    // stopPropagation evita que el clic siga viajando hacia la tarjeta,
    // que tiene su propio manejador para marcar el hábito.
    tarjeta.querySelector('.habito-nombre').onclick = (ev) => {
      if (!document.body.classList.contains('editando')) return;
      ev.stopPropagation();
      const nuevo = prompt('Nuevo nombre para el hábito:', h.nombre);
      if (nuevo !== null) renombrarHabito(h.id, nuevo);   // null = tocaste Cancelar
    };

    lista.appendChild(tarjeta);
  });
}

/* ---------- F0. EMOJIS (lógica pura, se prueba) ----------
   Un emoji no es "un carácter". Para JavaScript, 👨‍👩‍👧 son cinco piezas
   pegadas con un carácter invisible, y 🇨🇴 son dos. Si cortaras el texto
   a lo bruto con texto[0] te quedaría media cosa y saldría un símbolo
   roto. Intl.Segmenter agrupa esas piezas en lo que un humano ve como
   un solo símbolo — es la herramienta correcta para este trabajo.       */

function primerEmoji(texto) {
  const limpio = (texto || '').trim();
  if (!limpio) return '';

  let simbolo;
  if (typeof Intl !== 'undefined' && Intl.Segmenter) {
    // granularity: 'grapheme' = "córtame por símbolos visibles"
    const trozos = new Intl.Segmenter('es', { granularity: 'grapheme' }).segment(limpio);
    simbolo = [...trozos][0].segment;
  } else {
    // Plan B para navegadores viejos. Array.from al menos no parte
    // los pares de piezas, aunque no junta las familias.
    simbolo = Array.from(limpio)[0];
  }

  // Y ahora: ¿esto que quedó es de verdad un emoji, o escribiste una letra?
  //   Extended_Pictographic -> los emojis normales (😀 🏃 💧)
  //   Regional_Indicator    -> las banderas (🇨🇴 son dos de estos)
  //   ⃣                -> el cuadrito de los teclados numéricos (1️⃣)
  const esEmoji = /\p{Extended_Pictographic}|\p{Regional_Indicator}|⃣/u;
  return esEmoji.test(simbolo) ? simbolo : '';
}
/* ---------- fin F0 ---------- */

/* ---------- H. COPIA DE SEGURIDAD ----------
   Exportar = convertir nuestros datos a un archivo .json y entregártelo.
   Importar = leer ese archivo y volver a meter los datos en la app.
   Un .json es solo texto con la misma forma que ves en la sección A.     */

function nombreArchivo() {
  return `habitos-${hoy()}.json`;   // ej: habitos-2026-08-02.json
}

async function exportar() {
  // JSON.stringify con "null, 2" al final = con saltos de línea y sangría,
  // para que el archivo se pueda leer con los ojos si haces falta.
  const texto = JSON.stringify(datos, null, 2);
  const archivo = new File([texto], nombreArchivo(), { type: 'application/json' });

  // En el iPhone lo natural es el menú Compartir: te deja guardarlo en
  // Archivos, mandártelo por correo, subirlo a iCloud...
  if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
    try {
      await navigator.share({ files: [archivo], title: 'Copia de mis hábitos' });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;   // cancelaste el menú, todo bien
      // cualquier otro error: seguimos al plan B de abajo
    }
  }

  // Plan B (computador): una descarga normal
  const url = URL.createObjectURL(archivo);
  const enlace = document.createElement('a');
  enlace.href = url;
  enlace.download = nombreArchivo();
  enlace.click();
  URL.revokeObjectURL(url);
}

// Nunca confíes en un archivo de afuera. Revisamos que tenga la forma
// esperada antes de dejarlo entrar; si no, podríamos romper la app entera.
function esCopiaValida(obj) {
  if (!obj || typeof obj !== 'object') return false;
  if (!Array.isArray(obj.habitos)) return false;
  if (!obj.registros || typeof obj.registros !== 'object' || Array.isArray(obj.registros)) return false;

  // Cada hábito debe tener al menos id y nombre
  const habitosOk = obj.habitos.every(h =>
    h && typeof h.id === 'string' && typeof h.nombre === 'string');

  // Cada día del historial debe ser una lista de ids
  const registrosOk = Object.values(obj.registros).every(v => Array.isArray(v));

  // Las tareas son opcionales: una copia hecha antes de que existiera la
  // sección de Pendientes sigue siendo una copia válida. Pero si vienen,
  // tienen que tener la forma correcta.
  const tareasOk = !('tareas' in obj) || (
    Array.isArray(obj.tareas) &&
    obj.tareas.every(t => t && typeof t.id === 'string' && typeof t.texto === 'string')
  );

  return habitosOk && registrosOk && tareasOk;
}

// Devuelve true si se importó, false si no. Así quien la llama sabe qué pasó.
function importar(texto) {
  let copia;
  try {
    copia = JSON.parse(texto);
  } catch (e) {
    alert('Ese archivo no se puede leer. ¿Seguro que es una copia de Mis Hábitos?');
    return false;
  }

  if (!esCopiaValida(copia)) {
    alert('El archivo se lee, pero no tiene la forma de una copia de Mis Hábitos.');
    return false;
  }

  const cuantosHabitos = copia.habitos.length;
  const cuantosDias = Object.keys(copia.registros).length;

  if (!confirm(
    `La copia tiene ${cuantosHabitos} hábito(s) y ${cuantosDias} día(s) de historial.\n\n` +
    `Esto REEMPLAZA todo lo que tienes ahora. ¿Continuar?`)) return false;

  datos = {
    version: 1,
    habitos: copia.habitos,
    registros: copia.registros,
    // Si la copia es vieja y no trae tareas, entra con la lista vacía.
    tareas: Array.isArray(copia.tareas) ? copia.tareas : [],
    pendientes: Array.isArray(copia.pendientes) ? copia.pendientes : []
  };
  guardar();
  pintar();
  if (typeof pintarTareas === 'function') pintarTareas();

  // Restaurar una copia cambia todo de golpe, así que hay que volver a
  // subirlo entero. Si la nube no está cargada, esto simplemente no pasa.
  if (typeof subirTodo === 'function') subirTodo();

  return true;
}

/* ---------- L. EL CALENDARIO EN PANTALLA ----------
   La lógica de fechas ya quedó resuelta arriba (secciones B, C y D).
   Aquí solo traducimos esos números a cuadritos en la pantalla.
   Esa separación es a propósito: lo de arriba se puede probar con
   pruebas.js; esto de aquí hay que mirarlo con los ojos.             */

// Estas tres variables recuerdan "qué estoy viendo ahora mismo".
let calHabitoId = null;
let calAnio = 0;
let calMes = 0;

function abrirCalendario(idHabito) {
  calHabitoId = idHabito;
  const ahora = new Date();
  calAnio = ahora.getFullYear();
  calMes = ahora.getMonth() + 1;      // +1 porque adentro contamos 1-12
  pintarCalendario();
  document.getElementById('modalCal').classList.add('abierto');
}

function cerrarCalendario() {
  document.getElementById('modalCal').classList.remove('abierto');
  calHabitoId = null;
}

// paso vale +1 (mes siguiente) o -1 (mes anterior).
// El if se encarga del salto de año en diciembre y enero.
function moverMes(paso) {
  calMes += paso;
  if (calMes > 12) { calMes = 1;  calAnio++; }
  if (calMes < 1)  { calMes = 12; calAnio--; }
  pintarCalendario();
}

function pintarCalendario() {
  const h = datos.habitos.find(x => x.id === calHabitoId);
  if (!h) return;

  document.getElementById('calTitulo').textContent = `${h.emoji} ${h.nombre}`;
  document.getElementById('calMes').textContent =
    new Date(calAnio, calMes - 1, 1)
      .toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';   // borrón y cuenta nueva, igual que en pintar()

  // 1) Cuadros vacíos hasta llegar al día 1. Sin esto, el mes empezaría
  //    siempre en lunes y las columnas quedarían corridas.
  for (let i = 0; i < columnaInicio(calAnio, calMes); i++) {
    grid.appendChild(document.createElement('div'));
  }

  // 2) Un botón por cada día real del mes
  for (let d = 1; d <= diasDelMes(calAnio, calMes); d++) {
    const fecha = claveDe(calAnio, calMes, d);

    const celda = document.createElement('button');
    celda.className = 'cal-dia';
    if (estaHecho(calHabitoId, fecha)) celda.classList.add('hecho');
    if (fecha === hoy())               celda.classList.add('hoy');
    if (esFutura(fecha))               celda.classList.add('futuro');
    celda.textContent = d;

    // Tocar un día lo corrige. alternarFecha devuelve false si es futuro,
    // así que ahí no repintamos nada: el toque simplemente no hace efecto.
    celda.onclick = () => {
      if (alternarFecha(calHabitoId, fecha)) pintarCalendario();
    };

    grid.appendChild(celda);
  }

  // 3) El resumen de abajo
  const hechos = contarMes(calHabitoId, calAnio, calMes);
  const total = diasDelMes(calAnio, calMes);
  document.getElementById('calResumen').textContent =
    `${hechos} de ${total} días. Toca un día para corregirlo.`;

  // 4) Las estadísticas
  pintarStats();
}

/* ---------- M1. TRADUCIR ERRORES (lógica pura, se prueba) ----------
   Supabase responde en inglés y en jerga. Esta función traduce los
   casos que de verdad te pueden pasar. Está aparte del resto porque
   no toca ni la pantalla ni la red: así se puede probar. */
function mensajeDeError(error) {
  if (!error) return '';
  const texto = (error.message || '').toLowerCase();

  if (texto.includes('invalid login credentials'))
    return 'Correo o contraseña incorrectos.';
  if (texto.includes('email not confirmed'))
    return 'La cuenta existe pero está sin confirmar. Actívala desde el panel de Supabase.';
  if (texto.includes('failed to fetch') || texto.includes('network'))
    return 'Sin conexión. Tus hábitos siguen guardados en el teléfono.';
  if (texto.includes('rate limit') || texto.includes('too many'))
    return 'Demasiados intentos seguidos. Espera unos minutos.';

  return 'No se pudo entrar: ' + (error.message || 'error desconocido');
}

  sesion = data.session;

  // Un solo sitio que reacciona a cualquier cambio de sesión: entrar,
  // salir, o la renovación automática del token cada hora.
  nube.auth.onAuthStateChange((evento, nuevaSesion) => {
    const antesHabiaSesion = Boolean(sesion);
    sesion = nuevaSesion;
    pintarSesion();

    // Acabas de entrar: es el momento de sincronizar
    if (!antesHabiaSesion && sesion) primeraSincronizacion();
  });

  if (sesion) primeraSincronizacion();
  pintarSesion();
}

// La primera vez que entras en un dispositivo hay que empujar hacia arriba
// lo que ya tenías guardado aquí — tu historial de antes de la Fase 3, que
// la nube todavía no conoce. Después de esa vez, la cola normal se encarga.
function primeraSincronizacion() {
  if (!datos.subidaHecha) {
    subirTodo();               // en un teléfono nuevo esto no encola nada
    datos.subidaHecha = true;
    guardar();
  }
  sincronizar();
}

// Tres momentos en que vale la pena mirar la nube, además de al cambiar algo:
window.addEventListener('online', sincronizar);          // volvió la señal
document.addEventListener('visibilitychange', () => {    // volviste a la app
  if (document.visibilityState === 'visible') sincronizar();
});

/* ---------- M4. EL PANEL DE CUENTA ---------- */

function pintarSesion(mensaje, tipo) {
  const fuera  = document.getElementById('sesionFuera');
  const dentro = document.getElementById('sesionDentro');
  const estado = document.getElementById('sesionEstado');

  const conectado = Boolean(sesion);
  fuera.hidden  = conectado;
  dentro.hidden = !conectado;

  estado.className = 'sesion-estado' + (tipo ? ' ' + tipo : '');

  if (mensaje) {
    estado.textContent = mensaje;
  } else if (conectado) {
    let detalle;
    if (sincronizando)                  detalle = 'Sincronizando…';
    else if (navigator.onLine === false) detalle = textoPendientes(datos.pendientes.length) +
                                                   ' Sin señal por ahora.';
    else                                 detalle = textoPendientes(datos.pendientes.length);

    estado.textContent = `${sesion.user.email} — ${detalle}`;
    if (!sincronizando && datos.pendientes.length === 0) estado.className += ' bien';
  } else if (nube) {
    estado.textContent = 'Entra para respaldar tus hábitos en la nube.';
  } else {
    estado.textContent = 'Sin conexión con la nube. La app funciona igual, ' +
                         'con los datos del teléfono.';
  }
}

// Ahora el botón "Entrar" vive dentro de un <form>, así que en vez de
// escuchar su clic escuchamos el "submit" del formulario. Es lo mismo, pero
// además cubre el caso de darle a "Ir" en el teclado del teléfono.
// El preventDefault es obligatorio: sin él, el navegador intentaría enviar
// el formulario a un servidor y recargaría la página.
document.getElementById('formEntrar').onsubmit = async (ev) => {
  ev.preventDefault();
  const correo = document.getElementById('correo').value.trim();
  const clave  = document.getElementById('clave').value;

  if (!correo || !clave) {
    pintarSesion('Escribe tu correo y tu contraseña.', 'error');
    return;
  }

  const boton = document.getElementById('btnEntrar');
  boton.disabled = true;                       // que no lo toques dos veces
  pintarSesion('Entrando…');

  const error = await entrar(correo, clave);
  boton.disabled = false;

  if (error) {
    pintarSesion(mensajeDeError(error), 'error');
  } else {
    document.getElementById('clave').value = '';   // no dejarla en pantalla
    pintarSesion('Listo, entraste.', 'bien');
  }
};

document.getElementById('btnSalir').onclick = async () => {
  await salir();
  pintarSesion('Sesión cerrada. Tus hábitos siguen aquí en el teléfono.');
};

// Estado inicial, mientras la librería baja (o si nunca baja)
pintarSesion();

/* ---------- M5. TRADUCIR ENTRE LA APP Y LA BASE (puro, se prueba) ----------
   La app y Postgres guardan lo mismo con formas distintas. Estas tres
   funciones son los traductores. No tocan la red ni la pantalla: solo
   reciben datos y devuelven datos, así que se pueden probar. */

// De un hábito de la app a una fila de la tabla "habitos".
// El "orden" no está en el objeto: es su posición en la lista. Un array
// tiene orden por sí mismo; una tabla no, hay que escribirlo en una columna.
function habitoAFila(habito, indice, usuarioId) {
  return {
    id:      habito.id,
    usuario: usuarioId,
    nombre:  habito.nombre,
    emoji:   habito.emoji,
    creado:  habito.creado || hoy(),
    orden:   indice
  };
}

// De las filas de la tabla a la lista que usa la app.
// Nos quedamos solo con las columnas que la app necesita.
function filasAHabitos(filas) {
  return (filas || []).map(f => ({
    id: f.id, nombre: f.nombre, emoji: f.emoji, creado: f.creado
  }));
}

// De las filas de "registros" al objeto { fecha: [ids] }.
// Aquí se ve el cambio de forma más grande: en la base hay UNA FILA POR
// MARCA, y la app quiere las marcas agrupadas por día. Es lo mismo que
// haría un GROUP BY fecha en SQL.
function filasARegistros(filas) {
  const registros = {};
  (filas || []).forEach(f => {
    if (!registros[f.fecha]) registros[f.fecha] = [];
    if (!registros[f.fecha].includes(f.habito_id)) registros[f.fecha].push(f.habito_id);
  });
  return registros;
}

// Cuenta cuántos cambios distintos hay esperando, para el mensaje del panel.
function textoPendientes(cuantos) {
  if (cuantos === 0) return 'Todo sincronizado.';
  if (cuantos === 1) return '1 cambio esperando señal.';
  return `${cuantos} cambios esperando señal.`;
}
/* ---------- fin M5 ---------- */

/* ---------- M6. SUBIR Y BAJAR ---------- */

// Envía UN pendiente. Devuelve true si se pudo, false si no.
// Devolver false no es un fracaso definitivo: significa "todavía no",
// y el pendiente se queda en la cola para el próximo intento.
async function enviarPendiente(p) {
  const usuarioId = sesion.user.id;

  if (p.tipo === 'guardarHabito') {
    const i = datos.habitos.findIndex(h => h.id === p.id);
    if (i === -1) return true;   // lo borraste después; ya no hay nada que subir

    const { error } = await nube.from('habitos')
      .upsert(habitoAFila(datos.habitos[i], i, usuarioId));
    return !error;
  }

  if (p.tipo === 'borrarHabito') {
    const { error } = await nube.from('habitos').delete().eq('id', p.id);
    return !error;
  }

  if (p.tipo === 'marcar') {
    // upsert = "insertar, y si ya existe no te quejes". Como la llave
    // primaria es (habito_id, fecha), marcar dos veces el mismo día no
    // duplica nada: la base de datos no lo permite.
    const { error } = await nube.from('registros')
      .upsert({ usuario: usuarioId, habito_id: p.id, fecha: p.fecha });
    return !error;
  }

  if (p.tipo === 'desmarcar') {
    const { error } = await nube.from('registros').delete()
      .eq('habito_id', p.id).eq('fecha', p.fecha);
    return !error;
  }

  return true;   // un tipo desconocido no debe atascar la cola para siempre
}

// Baja el estado completo de la nube y reemplaza el local.
// Solo se llama cuando la cola quedó vacía, o sea cuando la nube ya tiene
// todo lo tuyo. Así "reemplazar" nunca pierde nada.
async function bajarTodo() {
  const { data: filasHabitos, error: e1 } =
    await nube.from('habitos').select('*').order('orden');
  if (e1) return false;

  const { data: filasRegistros, error: e2 } =
    await nube.from('registros').select('*');
  if (e2) return false;

  // Red de seguridad. Si la nube llega vacía pero aquí sí hay hábitos,
  // guardamos una copia aparte antes de reemplazar. No debería pasar nunca
  // — solo bajamos con la cola vacía — pero perder el historial es justo
  // lo que la Fase 3 vino a evitar, así que vale el par de líneas.
  if (filasHabitos.length === 0 && datos.habitos.length > 0) {
    localStorage.setItem(CLAVE + '-respaldo', JSON.stringify(datos));
    console.warn('La nube vino vacía. Copia de emergencia guardada.');
  }

  // Ojo: aquí NO se toca datos.tareas. Los pendientes viven solo en este
  // dispositivo, así que bajar de la nube no debe borrarlos. El día que
  // se sincronicen, este es el sitio donde habrá que agregarlos.
  datos.habitos   = filasAHabitos(filasHabitos);
  datos.registros = filasARegistros(filasRegistros);

  guardar();
  pintar();
  return true;
}

// Encola TODO lo que hay en el teléfono. Se usa dos veces: la primera vez
// que entras (para que tu historial de antes de la Fase 3 llegue a la nube)
// y al restaurar una copia de seguridad.
function subirTodo() {
  datos.habitos.forEach(h => encolar({ tipo: 'guardarHabito', id: h.id }));
  for (const fecha in datos.registros) {
    datos.registros[fecha].forEach(id => encolar({ tipo: 'marcar', id: id, fecha: fecha }));
  }
}

/* ---------- M7. EL CICLO DE SINCRONIZACIÓN ---------- */

let sincronizando = false;   // para que no corran dos a la vez
let reloj = null;            // el temporizador que agrupa cambios seguidos

// No sincronizamos en cada toque. Si marcas cuatro hábitos seguidos,
// esperamos un segundo desde el último y mandamos todo junto.
function pedirSincronizar() {
  clearTimeout(reloj);
  reloj = setTimeout(sincronizar, 1000);
}

async function sincronizar() {
  if (!nube || !sesion || sincronizando) return;
  if (navigator.onLine === false) { pintarSesion(); return; }

  sincronizando = true;
  pintarSesion();

  try {
    // 1) Primero SUBIR, en orden y de a uno. El orden importa: crear un
    //    hábito tiene que llegar antes que marcarlo.
    while (datos.pendientes.length > 0) {
      const pudo = await enviarPendiente(datos.pendientes[0]);

      // Si uno falla, paramos. No seguimos con los de atrás, porque
      // podrían depender de este. Se reintenta en la próxima ronda.
      if (!pudo) return;

      datos.pendientes.shift();
      guardar();
    }

    // 2) Y solo con la cola vacía, BAJAR. Este orden es la regla de oro:
    //    si bajáramos con cambios sin subir, la nube pisaría lo tuyo.
    await bajarTodo();

  } finally {
    sincronizando = false;
    pintarSesion();
  }
}

/* ---------- N. PENDIENTES EN PANTALLA Y LAS DOS SECCIONES ----------
   La lógica ya quedó resuelta arriba, en D2. Aquí solo traducimos esos
   datos a tarjetas y manejamos el cambio entre una sección y la otra.
   Misma separación que hicimos con el calendario (lógica en B/C/D,
   dibujado en L): lo de arriba se prueba, lo de aquí se mira.          */

// Dónde estás parado ahora mismo. Es la única variable que decide qué
// se ve; todo lo demás se deduce de ella.
let vista = 'habitos';

const listaTareas  = document.getElementById('listaTareas');
const tareasCuerpo = document.getElementById('tareasCuerpo');

// Al marcar una tarea esta se va al final de la lista. Guardamos cuál fue
// para darle la animación de "aterrizaje" y que el salto no se sienta un
// error. Se limpia sola después de dibujarla una vez.
let tareaRecienMovida = null;

function cambiarVista(nueva) {
  vista = nueva;
  const enTareas = vista === 'tareas';

  // Mostrar una lista y esconder la otra
  lista.hidden        = enTareas;
  listaTareas.hidden  = !enTareas;

  // La clase en el body deja que el CSS reaccione sin más JavaScript
  // (por ejemplo, esconder los paneles de copia y cuenta).
  document.body.classList.toggle('vista-tareas', enTareas);

  // Las pestañas se iluminan según dónde estés
  document.getElementById('pestanaHabitos').classList.toggle('activa', !enTareas);
  document.getElementById('pestanaTareas').classList.toggle('activa', enTareas);

  // El botón grande de abajo cambia de oficio según la sección
  document.getElementById('btnAgregar').textContent =
    enTareas ? '+ Nuevo pendiente' : '+ Nuevo hábito';

  // Y la etiqueta de la barra de progreso también
  document.getElementById('progresoEtiqueta').textContent = enTareas ? 'Pendientes' : 'Hoy';

  // Salir del modo edición al cambiar de sección: si te quedaras dentro,
  // llegarías a la otra lista con las ✕ puestas sin haberlo pedido.
  document.body.classList.remove('editando');
  document.getElementById('btnEditar').textContent = 'Editar';

  // Y redibujar la sección a la que llegaste
  if (enTareas) pintarTareas(); else pintar();
}

function pintarTareas() {
  // Al arrancar la app esta función corre una vez para dejar la lista
  // lista y el contador puesto, aunque estés viendo Hábitos. Este if
  // evita que en ese momento pise la barra de progreso del otro lado.
  const cuenta = contarTareas();
  document.getElementById('contadorTareas').textContent =
    cuenta.faltan > 0 ? cuenta.faltan : '';

  if (vista === 'tareas') {
    const cajaProgreso = document.getElementById('cajaProgreso');
    cajaProgreso.style.visibility = cuenta.total ? 'visible' : 'hidden';
    document.getElementById('progresoTexto').textContent = `${cuenta.hechas} de ${cuenta.total}`;
    document.getElementById('barra').style.width =
      (cuenta.total ? cuenta.hechas / cuenta.total * 100 : 0) + '%';
  }

  tareasCuerpo.innerHTML = '';

  if (datos.tareas.length === 0) {
    tareasCuerpo.innerHTML = `
      <div class="vacio">
        <div class="vacio-emoji">☑️</div>
        <div>Nada pendiente.<br>Escribe algo arriba cuando aparezca.</div>
      </div>`;
    return;
  }

  // tareasOrdenadas() ya devuelve las que faltan primero y las hechas al
  // final. Aquí solo recorremos el resultado.
  tareasOrdenadas().forEach(t => {
    const tarjeta = document.createElement('div');
    tarjeta.className = 'tarea' + (t.hecha ? ' hecha' : '')
                      + (t.id === tareaRecienMovida ? ' recien-movida' : '');

    tarjeta.innerHTML = `
      <div class="check">✓</div>
      <div class="tarea-texto"></div>
      <div class="acciones">
        <button class="borrar">✕</button>
      </div>
    `;

    // El texto se pone con textContent y no dentro del innerHTML de arriba.
    // Motivo: innerHTML interpreta lo que le des como HTML, así que un
    // pendiente escrito como "comprar <cosas>" se rompería. textContent lo
    // trata como texto y punto. Es la costumbre correcta con cualquier
    // texto que venga de fuera del código.
    tarjeta.querySelector('.tarea-texto').textContent = t.texto;

    // Marcar: el círculo, o tocar el texto fuera del modo edición
    const marcar = () => {
      tareaRecienMovida = t.hecha ? null : t.id;   // solo al completarla
      alternarTarea(t.id);
    };

    tarjeta.querySelector('.check').onclick = marcar;

    tarjeta.querySelector('.tarea-texto').onclick = () => {
      // En modo edición, tocar el texto lo cambia (igual que el nombre de
      // un hábito). Fuera de él, marca la tarea.
      if (!document.body.classList.contains('editando')) { marcar(); return; }
      const nuevo = prompt('Cambiar el pendiente:', t.texto);
      if (nuevo !== null) renombrarTarea(t.id, nuevo);
    };

    tarjeta.querySelector('.borrar').onclick = () => borrarTarea(t.id);

    tareasCuerpo.appendChild(tarjeta);
  });

  // Ya la dibujamos con su animación; se limpia para que no vuelva a
  // animarse en el siguiente repintado.
  tareaRecienMovida = null;

  // El botón de limpiar solo tiene sentido si hay algo que limpiar.
  if (cuenta.hechas > 0) {
    const btn = document.createElement('button');
    btn.className = 'limpiar-hechas';
    btn.textContent = `Limpiar ${cuenta.hechas} hecha(s)`;
    btn.onclick = () => {
      if (confirm(`¿Borrar las ${cuenta.hechas} tareas ya hechas?`)) limpiarHechas();
    };
    tareasCuerpo.appendChild(btn);
  }
}

/* --- Conectar los botones de esta sección --- */

document.getElementById('pestanaHabitos').onclick = () => cambiarVista('habitos');
document.getElementById('pestanaTareas').onclick  = () => cambiarVista('tareas');

const campoTarea = document.getElementById('tareaNueva');

function guardarTareaEscrita() {
  if (agregarTarea(campoTarea.value)) campoTarea.value = '';
  // El foco se queda en el campo: lo normal es anotar dos o tres cosas
  // seguidas, no una sola.
  campoTarea.focus();
}

// El campo y el botón "+" viven dentro de un <form>, así que basta con
// escuchar el "submit": lo disparan tanto el botón como la tecla Enter.
// preventDefault evita que el navegador recargue la página intentando
// mandar el formulario a un servidor que no existe.
document.getElementById('formTarea').onsubmit = (ev) => {
  ev.preventDefault();
  guardarTareaEscrita();
};

/* ---------- K. ARRANCAR ---------- */
pintar();
pintarTareas();   // deja el contador de la pestaña puesto desde el arranque
</script>

<!-- La librería de Supabase, directo desde un CDN.
     type="module" hace falta para poder usar "import". Este bloque va
     aparte del script grande a propósito: los módulos se ejecutan al
     final, después de que todo lo de arriba ya existe.
     Si el CDN no responde, este bloque entero no llega a ejecutarse y
     la app sigue funcionando con los datos del teléfono. Es justo lo
     que queremos: la nube es un extra, no un requisito. -->
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  iniciarNube(createClient).catch(e => console.log('Nube:', e));
</script>
